        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; color: #fff; margin-bottom: 30px; }
        header h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        header p { color: #aaa; }
        
        .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 15px; padding: 25px; color: #fff; }
        .panel h2 { margin-bottom: 20px; font-size: 1.3em; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; }
        
        .detection-wrapper { position: relative; }
        .detection-area { height: 300px; background: #0a0a0f; border-radius: 10px; position: relative; overflow: hidden; margin-bottom: 20px; }
        .detection-area canvas { width: 100%; height: 100%; }
        
        .character-mini { position: absolute; bottom: 10px; right: 10px; width: 60px; height: 80px; z-index: 10; cursor: pointer; }
        .character-mini .head { width: 30px; height: 30px; background: linear-gradient(135deg, #ffdab9, #f5deb3); border-radius: 50%; position: absolute; top: 0; left: 50%; transform: translateX(-50%); box-shadow: inset -3px -3px 6px rgba(0,0,0,0.1); }
        .character-mini .eye { width: 5px; height: 5px; background: #333; border-radius: 50%; position: absolute; top: 35%; }
        .character-mini .eye.left { left: 25%; }
        .character-mini .eye.right { right: 25%; }
        .character-mini .mouth { width: 10px; height: 5px; background: #e87d7d; border-radius: 0 0 8px 8px; position: absolute; bottom: 30%; left: 50%; transform: translateX(-50%); }
        .character-mini .body-mini { width: 25px; height: 30px; background: linear-gradient(135deg, #4ade80, #22c55e); border-radius: 8px 8px 5px 5px; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); }
        .character-mini .arm-mini { width: 8px; height: 18px; background: linear-gradient(135deg, #ffdab9, #f5deb3); border-radius: 4px; position: absolute; bottom: 45%; }
        .character-mini .arm-mini.left { left: 3px; transform-origin: bottom right; }
        .character-mini .arm-mini.right { right: 3px; transform-origin: bottom left; }
        .character-mini .leg-mini { width: 8px; height: 15px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); border-radius: 4px; position: absolute; bottom: -15px; }
        .character-mini .leg-mini.left { left: 8px; }
        .character-mini .leg-mini.right { right: 8px; }
        .character-mini .antenna-mini { width: 2px; height: 10px; background: #fbbf24; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); }
        .character-mini .antenna-light-mini { width: 6px; height: 6px; background: #fbbf24; border-radius: 50%; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); box-shadow: 0 0 8px #fbbf24, 0 0 15px #fbbf24; animation: blink 2s infinite; }
        
        .character-mini.speaking .mouth { animation: talk 0.3s infinite; }
        .character-mini.waving .arm-mini.left { animation: wave-left 0.5s ease-in-out infinite; }
        
        .speech-bubble-mini { background: rgba(255,255,255,0.95); color: #333; padding: 8px 12px; border-radius: 15px; position: absolute; top: -50px; right: 0; white-space: nowrap; font-size: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); max-width: 180px; }
        .speech-bubble-mini::after { content: ''; position: absolute; bottom: -6px; right: 20px; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 6px solid rgba(255,255,255,0.95); }
        .speech-bubble-mini.hidden { display: none; }
        
        @keyframes talk {
            0%, 100% { height: 5px; border-radius: 0 0 8px 8px; }
            50% { height: 10px; border-radius: 50%; }
        }
        
        @keyframes wave-left {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-30deg); }
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px #fbbf24, 0 0 15px #fbbf24; }
            50% { opacity: 0.5; box-shadow: 0 0 4px #fbbf24; }
        }
        
        .detection-status { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .status-item { text-align: center; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; }
        .status-item .label { font-size: 0.8em; color: #888; }
        .status-item .value { font-size: 1.5em; font-weight: bold; }
        .value.safe { color: #4ade80; }
        .value.warning { color: #fbbf24; }
        .value.danger { color: #f87171; }
        
        .controls { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 1em; font-weight: bold; transition: all 0.3s; }
        .btn.start { background: linear-gradient(135deg, #4ade80, #22c55e); color: #000; }
        .btn.stop { background: linear-gradient(135deg, #f87171, #ef4444); color: #fff; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        
        .chat-area { display: flex; flex-direction: column; height: 450px; }
        .chat-messages { flex: 1; overflow-y: auto; background: #0a0a0f; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .chat-message { margin-bottom: 15px; max-width: 80%; }
        .chat-message.user { text-align: right; }
        .chat-message.bot { text-align: left; display: flex; align-items: flex-start; gap: 10px; }
        .chat-message .content { display: inline-block; padding: 10px 15px; border-radius: 20px; }
        .chat-message.user .content { background: #3b82f6; color: #fff; }
        .chat-message.bot .content { background: rgba(255,255,255,0.1); color: #fff; }
        
        .chat-input { display: flex; gap: 10px; }
        .chat-input input { flex: 1; padding: 12px 15px; border: none; border-radius: 25px; background: rgba(255,255,255,0.1); color: #fff; font-size: 1em; }
        .chat-input input:focus { outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5); }
        
        .language-selector { margin-bottom: 15px; display: flex; gap: 10px; }
        .lang-btn { padding: 8px 16px; border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; background: transparent; color: #fff; cursor: pointer; transition: all 0.3s; }
        .lang-btn.active { background: #3b82f6; border-color: #3b82f6; }
        
        .obstacle-list { list-style: none; max-height: 200px; overflow-y: auto; }
        .obstacle-item { padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .obstacle-item .name { font-weight: bold; }
        .obstacle-item .distance { font-size: 0.9em; color: #888; }
        
        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; }
        }
    </style>

                trafficLight: '전방 신호등 있습니다, 주의하세요!',
                speed: '현재 속도 정상입니다, 유지하세요!',
                weatherBad: '날씨가 안 좋네요, 조심해서 운전하세요!',
                foggy: '전방에 안개 있습니다, 감속하세요!',
                rain: '비 오고 있어요, 길이 미끄러워요, 조심하세요!',
                snow: '눈 오고 있어요, 길이 미끄러워요, 조심하세요!',
                trafficJam: '전방에 정체 있습니다, 조심하세요!',
                roadWork: '전방에 도로 공사 있습니다, 우회하거나 조심해서 통과하세요!',
                accident: '전방에 사고 있습니다, 감속해서 조심하세요!',
                school: '전방에 학교 있습니다, 감속하세요!',
                hospital: '전방에 병원 있습니다, 구급차 나올 수 있어요, 조심하세요!'
            }
        };

        let currentLang = 'zh';
        let isDetecting = false;
        let detectInterval = null;
        let obstacles = [];
        const canvas = document.getElementById('detectionCanvas');
        const ctx = canvas.getContext('2d');
        const characterMini = document.getElementById('characterMini');
        const speechBubbleMini = document.getElementById('speechBubbleMini');
        
        function updateLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-lang="${lang}"]`).classList.add('active');
            document.getElementById('chatInput').placeholder = messages[lang].placeholder;
        }
        
        function showCharacterSpeaking(text) {
            characterMini.classList.add('speaking', 'waving');
            speechBubbleMini.textContent = text.length > 15 ? text.substring(0, 15) + '...' : text;
            speechBubbleMini.classList.remove('hidden');
        }
        
        function hideCharacterSpeaking() {
            characterMini.classList.remove('speaking', 'waving');
            speechBubbleMini.classList.add('hidden');
        }
        
        function speak(text) {
            showCharacterSpeaking(text);
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = currentLang === 'zh' ? 'zh-CN' : currentLang === 'en' ? 'en-US' : currentLang === 'ja' ? 'ja-JP' : 'ko-KR';
                utterance.rate = 0.9;
                utterance.onend = function() {
                    setTimeout(hideCharacterSpeaking, 300);
                };
                utterance.onerror = function() {
                    hideCharacterSpeaking();
                };
                window.speechSynthesis.speak(utterance);
            } else {
                setTimeout(hideCharacterSpeaking, 2000);
            }
        }
        
        function addMessage(text, isUser = false) {
            const messagesDiv = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `chat-message ${isUser ? 'user' : 'bot'}`;
            if (isUser) {
                div.innerHTML = `<div class="content">${text}</div>`;
            } else {
                div.innerHTML = `<div class="avatar">🤖</div><div class="content">${text}</div>`;
            }
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function handleChat(message) {
            const lowerMsg = message.toLowerCase().trim();
            const msg = messages[currentLang];
            
            if (lowerMsg.includes('你好') || lowerMsg.includes('hello') || lowerMsg.includes('こんにちは') || lowerMsg.includes('안녕') || lowerMsg.includes('hi')) {
                return msg.hello;
            } else if (lowerMsg.includes('好吗') || lowerMsg.includes('how are you') || lowerMsg.includes('元気') || lowerMsg.includes('잘 지내') || lowerMsg.includes('近来') || lowerMsg.includes('最近')) {
                return msg.howareyou;
            } else if (lowerMsg.includes('再见') || lowerMsg.includes('goodbye') || lowerMsg.includes('さようなら') || lowerMsg.includes('안녕히') || lowerMsg.includes('bye')) {
                return msg.goodbye;
            } else if (lowerMsg.includes('谢谢') || lowerMsg.includes('thank') || lowerMsg.includes('ありがとう') || lowerMsg.includes('감사') || lowerMsg.includes('thx')) {
                return msg.thanks;
            } else if (lowerMsg.includes('帮助') || lowerMsg.includes('help') || lowerMsg.includes('ヘルプ') || lowerMsg.includes('도움') || lowerMsg.includes('有什么用') || lowerMsg.includes('能做什么')) {
                return msg.help;
            } else if (lowerMsg.includes('天气') || lowerMsg.includes('weather') || lowerMsg.includes('天気') || lowerMsg.includes('날씨')) {
                return msg.weather;
            } else if (lowerMsg.includes('名字') || lowerMsg.includes('name') || lowerMsg.includes('名前') || lowerMsg.includes('이름') || lowerMsg.includes('你叫什么')) {
                return msg.name;
            } else if (lowerMsg.includes('爱好') || lowerMsg.includes('hobby') || lowerMsg.includes('趣味') || lowerMsg.includes('취미')) {
                return msg.hobby;
            } else if (lowerMsg.includes('年龄') || lowerMsg.includes('age') || lowerMsg.includes('年') || lowerMsg.includes('나이') || lowerMsg.includes('几岁')) {
                return msg.age;
            } else if (lowerMsg.includes('笑话') || lowerMsg.includes('joke') || lowerMsg.includes('冗談') || lowerMsg.includes('농담') || lowerMsg.includes('讲个笑话')) {
                return msg.joke;
            } else if (lowerMsg.includes('唱歌') || lowerMsg.includes('song') || lowerMsg.includes('歌') || lowerMsg.includes('노래') || lowerMsg.includes('唱')) {
                return msg.song;
            } else if (lowerMsg.includes('路况') || lowerMsg.includes('traffic') || lowerMsg.includes('交通') || lowerMsg.includes('교통')) {
                return msg.traffic;
            } else if (lowerMsg.includes('早上好') || lowerMsg.includes('早安') || lowerMsg.includes('good morning') || lowerMsg.includes('おはよう') || lowerMsg.includes('좋은 아침')) {
                return msg.morning;
            } else if (lowerMsg.includes('下午好') || lowerMsg.includes('good afternoon') || lowerMsg.includes('こんにちは') || lowerMsg.includes('좋은 오후')) {
                return msg.afternoon;
            } else if (lowerMsg.includes('晚上好') || lowerMsg.includes('good evening') || lowerMsg.includes('こんばんは') || lowerMsg.includes('좋은 저녁')) {
                return msg.evening;
            } else if (lowerMsg.includes('晚安') || lowerMsg.includes('good night') || lowerMsg.includes('おやすみ') || lowerMsg.includes('좋은 밤') || lowerMsg.includes('睡觉')) {
                return msg.night;
            } else if (lowerMsg.includes('饭店') || lowerMsg.includes('餐厅') || lowerMsg.includes('restaurant') || lowerMsg.includes('食堂') || lowerMsg.includes('식당') || lowerMsg.includes('饿了')) {
                return msg.restaurant;
            } else if (lowerMsg.includes('音乐') || lowerMsg.includes('music') || lowerMsg.includes('音楽') || lowerMsg.includes('음악')) {
                return msg.music;
            } else if (lowerMsg.includes('电影') || lowerMsg.includes('movie') || lowerMsg.includes('映画') || lowerMsg.includes('영화')) {
                return msg.movie;
            } else if (lowerMsg.includes('新闻') || lowerMsg.includes('news') || lowerMsg.includes('ニュース') || lowerMsg.includes('뉴스')) {
                return msg.news;
            } else if (lowerMsg.includes('美食') || lowerMsg.includes('food') || lowerMsg.includes('料理') || lowerMsg.includes('음식')) {
                return msg.food;
            } else if (lowerMsg.includes('旅行') || lowerMsg.includes('travel') || lowerMsg.includes('旅行') || lowerMsg.includes('여행')) {
                return msg.travel;
            } else if (lowerMsg.includes('运动') || lowerMsg.includes('sports') || lowerMsg.includes('スポーツ') || lowerMsg.includes('운동')) {
                return msg.sports;
            } else if (lowerMsg.includes('雾') || lowerMsg.includes('fog') || lowerMsg.includes('霧') || lowerMsg.includes('안개')) {
                return msg.foggy;
            } else if (lowerMsg.includes('雨') || lowerMsg.includes('rain') || lowerMsg.includes('雨') || lowerMsg.includes('비')) {
                return msg.rain;
            } else if (lowerMsg.includes('雪') || lowerMsg.includes('snow') || lowerMsg.includes('雪') || lowerMsg.includes('눈')) {
                return msg.snow;
            } else if (lowerMsg.includes('堵车') || lowerMsg.includes('塞车') || lowerMsg.includes('堵') || lowerMsg.includes('jam') || lowerMsg.includes('込') || lowerMsg.includes('정체')) {
                return msg.trafficJam;
            } else if (lowerMsg.includes('施工') || lowerMsg.includes('work') || lowerMsg.includes('工事') || lowerMsg.includes('공사')) {
                return msg.roadWork;
            } else if (lowerMsg.includes('事故') || lowerMsg.includes('accident') || lowerMsg.includes('事故') || lowerMsg.includes('사고')) {
                return msg.accident;
            } else if (lowerMsg.includes('学校') || lowerMsg.includes('school') || lowerMsg.includes('学校') || lowerMsg.includes('학교')) {
                return msg.school;
            } else if (lowerMsg.includes('医院') || lowerMsg.includes('hospital') || lowerMsg.includes('病院') || lowerMsg.includes('병원')) {
                return msg.hospital;
            } else {
                return msg.unknown;
            }
        }
        
        function drawDetection() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#16213e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 30) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 30) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
            
            ctx.fillStyle = '#4ade80';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height - 30, 15, 0, Math.PI * 2);
            ctx.fill();
            
            obstacles.forEach((obs, index) => {
                const x = obs.x * canvas.width;
                const y = obs.y * canvas.height;
                const size = 20 + Math.random() * 20;
                
                if (obs.distance < 30) {
                    ctx.fillStyle = '#f87171';
                    ctx.shadowColor = '#f87171';
                } else if (obs.distance < 60) {
                    ctx.fillStyle = '#fbbf24';
                    ctx.shadowColor = '#fbbf24';
                } else {
                    ctx.fillStyle = '#4ade80';
                    ctx.shadowColor = '#4ade80';
                }
                ctx.shadowBlur = 15;
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(obs.name, x, y + 5);
            });
        }
        
        function simulateDetection() {
            obstacles = [];
            const count = Math.floor(Math.random() * 4);
            
            for (let i = 0; i < count; i++) {
                obstacles.push({
                    x: 0.3 + Math.random() * 0.4,
                    y: 0.1 + Math.random() * 0.6,
                    distance: Math.floor(10 + Math.random() * 90),
                    name: ['行人', '车辆', '障碍物', '施工'][Math.floor(Math.random() * 4)]
                });
            }
            
            obstacles.sort((a, b) => a.distance - b.distance);
            
            document.getElementById('obstacleCount').textContent = obstacles.length;
            document.getElementById('obstacleCount').className = `value ${obstacles.length > 0 ? (obstacles[0].distance < 30 ? 'danger' : 'warning') : 'safe'}`;
            
            if (obstacles.length > 0) {
                document.getElementById('closestDistance').textContent = obstacles[0].distance + 'm';
                document.getElementById('closestDistance').className = `value ${obstacles[0].distance < 30 ? 'danger' : obstacles[0].distance < 60 ? 'warning' : 'safe'}`;
                
                const closest = obstacles[0];
                speak(messages[currentLang].obstacleDetected.replace('{distance}', closest.distance));
            } else {
                document.getElementById('closestDistance').textContent = '--';
                document.getElementById('closestDistance').className = 'value safe';
                speak(messages[currentLang].safe);
            }
            
            const list = document.getElementById('obstacleList');
            list.innerHTML = obstacles.map(obs => 
                `<li class="obstacle-item">
                    <span class="name">${obs.name}</span>
                    <span class="distance">${obs.distance}m</span>
                </li>`
            ).join('');
            
            drawDetection();
        }
        
        document.getElementById('startBtn').addEventListener('click', () => {
            isDetecting = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('detectionStatus').textContent = '检测中';
            document.getElementById('detectionStatus').className = 'value danger';
            
            speak(messages[currentLang].start);
            simulateDetection();
            detectInterval = setInterval(simulateDetection, 3000);
        });
        
        document.getElementById('stopBtn').addEventListener('click', () => {
            isDetecting = false;
            clearInterval(detectInterval);
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('detectionStatus').textContent = '已停止';
            document.getElementById('detectionStatus').className = 'value safe';
            
            speak(messages[currentLang].stop);
            obstacles = [];
            drawDetection();
        });
        
        document.getElementById('sendBtn').addEventListener('click', () => {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (message) {
                addMessage(message, true);
                const response = handleChat(message);
                setTimeout(() => {
                    addMessage(response);
                    speak(response);
                }, 500);
                input.value = '';
            }
        });
        
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('sendBtn').click();
            }
        });
        
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                updateLang(btn.dataset.lang);
            });
        });
        
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        drawDetection();
        
        setTimeout(() => {
            addMessage(messages[currentLang].greet);
            speak(messages[currentLang].greet);
        }, 500);
        
        window.addEventListener('resize', () => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            drawDetection();
        });
    </script>
</body></html>
