<!DOCTYPE html><html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能路况检测系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; color: #fff; margin-bottom: 30px; }
        header h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        header p { color: #aaa; }
        
        .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 15px; padding: 25px; color: #fff; }
        .panel h2 { margin-bottom: 20px; font-size: 1.3em; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; }
        
        .detection-area { height: 300px; background: #0a0a0f; border-radius: 10px; position: relative; overflow: hidden; margin-bottom: 20px; }
        .detection-area canvas { width: 100%; height: 100%; }
        .detection-status { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .status-item { text-align: center; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; }
        .status-item .label { font-size: 0.8em; color: #888; }
        .status-item .value { font-size: 1.5em; font-weight: bold; }
        .value.safe { color: #4ade80; }
        .value.warning { color: #fbbf24; }
        .value.danger { color: #f87171; }
        
        .controls { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 1em; font-weight: bold; transition: all 0.3s; }
        .btn.start { background: linear-gradient(135deg, #4ade80, #22c55e); color: #000; }
        .btn.stop { background: linear-gradient(135deg, #f87171, #ef4444); color: #fff; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        
        .chat-area { display: flex; flex-direction: column; height: 500px; }
        .chat-messages { flex: 1; overflow-y: auto; background: #0a0a0f; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .chat-message { margin-bottom: 15px; max-width: 80%; }
        .chat-message.user { text-align: right; }
        .chat-message.bot { text-align: left; display: flex; align-items: flex-start; gap: 10px; }
        .chat-message .content { display: inline-block; padding: 10px 15px; border-radius: 20px; }
        .chat-message.user .content { background: #3b82f6; color: #fff; }
        .chat-message.bot .content { background: rgba(255,255,255,0.1); color: #fff; }
        
        .chat-input { display: flex; gap: 10px; }
        .chat-input input { flex: 1; padding: 12px 15px; border: none; border-radius: 25px; background: rgba(255,255,255,0.1); color: #fff; font-size: 1em; }
        .chat-input input:focus { outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5); }
        
        .language-selector { margin-bottom: 15px; display: flex; gap: 10px; }
        .lang-btn { padding: 8px 16px; border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; background: transparent; color: #fff; cursor: pointer; transition: all 0.3s; }
        .lang-btn.active { background: #3b82f6; border-color: #3b82f6; }
        
        .obstacle-list { list-style: none; max-height: 200px; overflow-y: auto; }
        .obstacle-item { padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .obstacle-item .name { font-weight: bold; }
        .obstacle-item .distance { font-size: 0.9em; color: #888; }
        
        .character-container { text-align: center; margin-bottom: 15px; }
        .character { display: inline-block; position: relative; }
        .character-body { width: 80px; height: 120px; position: relative; }
        .head { width: 50px; height: 50px; background: linear-gradient(135deg, #ffdab9, #f5deb3); border-radius: 50%; position: absolute; top: 0; left: 50%; transform: translateX(-50%); box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1); }
        .eye { width: 8px; height: 8px; background: #333; border-radius: 50%; position: absolute; top: 35%; }
        .eye.left { left: 25%; }
        .eye.right { right: 25%; }
        .mouth { width: 15px; height: 8px; background: #e87d7d; border-radius: 0 0 10px 10px; position: absolute; bottom: 30%; left: 50%; transform: translateX(-50%); transition: all 0.1s; }
        .mouth.talking { animation: talk 0.3s infinite; }
        .body { width: 40px; height: 50px; background: linear-gradient(135deg, #4ade80, #22c55e); border-radius: 10px 10px 5px 5px; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); }
        .arm { width: 12px; height: 30px; background: linear-gradient(135deg, #ffdab9, #f5deb3); border-radius: 6px; position: absolute; bottom: 40%; }
        .arm.left { left: 5px; transform-origin: bottom right; animation: wave-left 1s ease-in-out infinite; }
        .arm.right { right: 5px; transform-origin: bottom left; }
        .leg { width: 12px; height: 25px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); border-radius: 6px; position: absolute; bottom: -25px; }
        .leg.left { left: 10px; }
        .leg.right { right: 10px; }
        .antenna { width: 3px; height: 15px; background: #fbbf24; position: absolute; top: -15px; left: 50%; transform: translateX(-50%); }
        .antenna-light { width: 8px; height: 8px; background: #fbbf24; border-radius: 50%; position: absolute; top: -20px; left: 50%; transform: translateX(-50%); box-shadow: 0 0 10px #fbbf24, 0 0 20px #fbbf24; animation: blink 2s infinite; }
        
        @keyframes talk {
            0%, 100% { height: 8px; border-radius: 0 0 10px 10px; }
            50% { height: 15px; border-radius: 50%; }
        }
        
        @keyframes wave-left {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-30deg); }
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px #fbbf24, 0 0 20px #fbbf24; }
            50% { opacity: 0.5; box-shadow: 0 0 5px #fbbf24; }
        }
        
        .character.speaking .mouth { animation: talk 0.3s infinite; }
        .character.waving .arm.left { animation: wave-left 0.5s ease-in-out infinite; }
        
        .speech-bubble { background: rgba(255,255,255,0.95); color: #333; padding: 10px 15px; border-radius: 20px; position: absolute; top: -80px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); max-width: 200px; }
        .speech-bubble::after { content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 8px solid rgba(255,255,255,0.95); }
        .speech-bubble.hidden { display: none; }
        
        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 智能路况检测系统</h1>
            <p>实时路况检测 · 语音通报 · 多语言聊天</p>
        </header>
        
        <div class="main-content">
            <div class="panel">
                <h2>📡 路况检测</h2>
                <div class="detection-area" id="detectionArea">
                    <canvas id="detectionCanvas"></canvas>
                </div>
                
                <div class="detection-status">
                    <div class="status-item">
                        <div class="label">检测状态</div>
                        <div class="value" id="detectionStatus">未检测</div>
                    </div>
                    <div class="status-item">
                        <div class="label">障碍物数量</div>
                        <div class="value" id="obstacleCount">0</div>
                    </div>
                    <div class="status-item">
                        <div class="label">最近距离</div>
                        <div class="value" id="closestDistance">--</div>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="btn start" id="startBtn">开始检测</button>
                    <button class="btn stop" id="stopBtn" disabled>停止检测</button>
                </div>
                
                <h3 style="margin-top: 20px;">检测到的障碍物</h3>
                <ul class="obstacle-list" id="obstacleList"></ul>
            </div>
            
            <div class="panel">
                <h2>💬 智能助手</h2>
                <div class="language-selector" id="languageSelector">
                    <button class="lang-btn active" data-lang="zh">中文</button>
                    <button class="lang-btn" data-lang="en">English</button>
                    <button class="lang-btn" data-lang="ja">日本語</button>
                    <button class="lang-btn" data-lang="ko">한국어</button>
                </div>
                
                <div class="character-container">
                    <div class="character" id="character">
                        <div class="speech-bubble hidden" id="speechBubble">你好！</div>
                        <div class="antenna-light"></div>
                        <div class="antenna"></div>
                        <div class="head">
                            <div class="eye left"></div>
                            <div class="eye right"></div>
                            <div class="mouth"></div>
                        </div>
                        <div class="body">
                            <div class="arm left"></div>
                            <div class="arm right"></div>
                            <div class="leg left"></div>
                            <div class="leg right"></div>
                        </div>
                    </div>
                </div>
                
                <div class="chat-area">
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input">
                        <input type="text" id="chatInput" placeholder="输入消息..." />
                        <button class="btn start" id="sendBtn">发送</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const messages = {
            zh: {
                greet: '你好！我是你的智能路况助手。有什么可以帮助你的吗？',
                obstacleDetected: '检测到障碍物！距离约 {distance} 米。',
                safe: '道路安全，无障碍物。',
                start: '开始实时路况检测...',
                stop: '已停止检测。',
                help: '我可以帮你检测路况、通报障碍物，还能陪你聊天！',
                unknown: '抱歉，我不太明白你的意思。',
                placeholder: '输入消息...',
                hello: '你好！很高兴认识你！',
                howareyou: '我很好，谢谢关心！你呢？',
                goodbye: '再见！祝你旅途愉快！',
                thanks: '不客气！很高兴能帮到你！'
            },
            en: {
                greet: 'Hello! I am your intelligent road condition assistant. How can I help you?',
                obstacleDetected: 'Obstacle detected! Approximately {distance} meters away.',
                safe: 'Road is clear and safe.',
                start: 'Starting real-time road detection...',
                stop: 'Detection stopped.',
                help: 'I can help detect road conditions, announce obstacles, and chat with you!',
                unknown: 'Sorry, I don\'t understand.',
                placeholder: 'Enter message...',
                hello: 'Hello! Nice to meet you!',
                howareyou: 'I\'m doing well, thank you! How about you?',
                goodbye: 'Goodbye! Have a pleasant journey!',
                thanks: 'You\'re welcome! Happy to help!'
            },
            ja: {
                greet: 'こんにちは！私はあなたのスマート道路状況アシスタントです。何かお手伝いできますか？',
                obstacleDetected: '障害物を検出しました！距離は約 {distance} メートルです。',
                safe: '道路は安全で、障害物はありません。',
                start: 'リアルタイム道路検出を開始します...',
                stop: '検出を停止しました。',
                help: '道路状況の検出、障害物の通知、チャットができます！',
                unknown: '申し訳ありません、よくわかりません。',
                placeholder: 'メッセージを入力...',
                hello: 'こんにちは！はじめまして！',
                howareyou: '私は元気です、ありがとう！あなたは？',
                goodbye: 'さようなら！良い旅を！',
                thanks: 'どういたしまして！お手伝いできて嬉しいです！'
            },
            ko: {
                greet: '안녕하세요! 저는 당신의 스마트 도로 상황 비서입니다. 무엇을 도와드릴까요?',
                obstacleDetected: '장애물 감지! 거리 약 {distance} 미터.',
                safe: '도로 안전, 장애물 없음.',
                start: '실시간 도로 검출 시작...',
                stop: '검출 중지.',
                help: '도로 상황 검출, 장애물 통보, 채팅 가능!',
                unknown: '죄송합니다, 이해하지 못했습니다.',
                placeholder: '메시지 입력...',
                hello: '안녕하세요! 만나서 반갑습니다!',
                howareyou: '저는 잘 지냅니다, 감사합니다! 당신은요?',
                goodbye: '안녕히 가세요! 즐거운 여행 되세요!',
                thanks: '천만에요! 도와드릴 수 있어서 기쁩니다!'
            }
        };

        let currentLang = 'zh';
        let isDetecting = false;
        let detectInterval = null;
        let obstacles = [];
        const canvas = document.getElementById('detectionCanvas');
        const ctx = canvas.getContext('2d');
        const character = document.getElementById('character');
        const speechBubble = document.getElementById('speechBubble');
        
        function updateLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-lang="${lang}"]`).classList.add('active');
            document.getElementById('chatInput').placeholder = messages[lang].placeholder;
        }
        
        function showCharacterSpeaking(text) {
            character.classList.add('speaking', 'waving');
            speechBubble.textContent = text.length > 20 ? text.substring(0, 20) + '...' : text;
            speechBubble.classList.remove('hidden');
        }
        
        function hideCharacterSpeaking() {
            character.classList.remove('speaking', 'waving');
            speechBubble.classList.add('hidden');
        }
        
        function speak(text) {
            showCharacterSpeaking(text);
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = currentLang === 'zh' ? 'zh-CN' : currentLang === 'en' ? 'en-US' : currentLang === 'ja' ? 'ja-JP' : 'ko-KR';
                utterance.rate = 0.9;
                utterance.onend = function() {
                    setTimeout(hideCharacterSpeaking, 300);
                };
                utterance.onerror = function() {
                    hideCharacterSpeaking();
                };
                window.speechSynthesis.speak(utterance);
            } else {
                setTimeout(hideCharacterSpeaking, 2000);
            }
        }
        
        function addMessage(text, isUser = false) {
            const messagesDiv = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `chat-message ${isUser ? 'user' : 'bot'}`;
            if (isUser) {
                div.innerHTML = `<div class="content">${text}</div>`;
            } else {
                div.innerHTML = `<div class="avatar">🤖</div><div class="content">${text}</div>`;
            }
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function handleChat(message) {
            const lowerMsg = message.toLowerCase().trim();
            
            if (lowerMsg.includes('你好') || lowerMsg.includes('hello') || lowerMsg.includes('こんにちは') || lowerMsg.includes('안녕')) {
                return messages[currentLang].hello;
            } else if (lowerMsg.includes('你好吗') || lowerMsg.includes('how are you') || lowerMsg.includes('元気') || lowerMsg.includes('잘 지내')) {
                return messages[currentLang].howareyou;
            } else if (lowerMsg.includes('再见') || lowerMsg.includes('goodbye') || lowerMsg.includes('さようなら') || lowerMsg.includes('안녕히')) {
                return messages[currentLang].goodbye;
            } else if (lowerMsg.includes('谢谢') || lowerMsg.includes('thank') || lowerMsg.includes('ありがとう') || lowerMsg.includes('감사')) {
                return messages[currentLang].thanks;
            } else if (lowerMsg.includes('帮助') || lowerMsg.includes('help') || lowerMsg.includes('ヘルプ') || lowerMsg.includes('도움')) {
                return messages[currentLang].help;
            } else {
                return messages[currentLang].unknown;
            }
        }
        
        function drawDetection() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#16213e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 30) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 30) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
            
            ctx.fillStyle = '#4ade80';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height - 30, 15, 0, Math.PI * 2);
            ctx.fill();
            
            obstacles.forEach((obs, index) => {
                const x = obs.x * canvas.width;
                const y = obs.y * canvas.height;
                const size = 20 + Math.random() * 20;
                
                if (obs.distance < 30) {
                    ctx.fillStyle = '#f87171';
                    ctx.shadowColor = '#f87171';
                } else if (obs.distance < 60) {
                    ctx.fillStyle = '#fbbf24';
                    ctx.shadowColor = '#fbbf24';
                } else {
                    ctx.fillStyle = '#4ade80';
                    ctx.shadowColor = '#4ade80';
                }
                ctx.shadowBlur = 15;
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(obs.name, x, y + 5);
            });
        }
        
        function simulateDetection() {
            obstacles = [];
            const count = Math.floor(Math.random() * 4);
            
            for (let i = 0; i < count; i++) {
                obstacles.push({
                    x: 0.3 + Math.random() * 0.4,
                    y: 0.1 + Math.random() * 0.6,
                    distance: Math.floor(10 + Math.random() * 90),
                    name: ['行人', '车辆', '障碍物', '施工'][Math.floor(Math.random() * 4)]
                });
            }
            
            obstacles.sort((a, b) => a.distance - b.distance);
            
            document.getElementById('obstacleCount').textContent = obstacles.length;
            document.getElementById('obstacleCount').className = `value ${obstacles.length > 0 ? (obstacles[0].distance < 30 ? 'danger' : 'warning') : 'safe'}`;
            
            if (obstacles.length > 0) {
                document.getElementById('closestDistance').textContent = obstacles[0].distance + 'm';
                document.getElementById('closestDistance').className = `value ${obstacles[0].distance < 30 ? 'danger' : obstacles[0].distance < 60 ? 'warning' : 'safe'}`;
                
                const closest = obstacles[0];
                speak(messages[currentLang].obstacleDetected.replace('{distance}', closest.distance));
            } else {
                document.getElementById('closestDistance').textContent = '--';
                document.getElementById('closestDistance').className = 'value safe';
                speak(messages[currentLang].safe);
            }
            
            const list = document.getElementById('obstacleList');
            list.innerHTML = obstacles.map(obs => 
                `<li class="obstacle-item">
                    <span class="name">${obs.name}</span>
                    <span class="distance">${obs.distance}m</span>
                </li>`
            ).join('');
            
            drawDetection();
        }
        
        document.getElementById('startBtn').addEventListener('click', () => {
            isDetecting = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('detectionStatus').textContent = '检测中';
            document.getElementById('detectionStatus').className = 'value danger';
            
            speak(messages[currentLang].start);
            simulateDetection();
            detectInterval = setInterval(simulateDetection, 3000);
        });
        
        document.getElementById('stopBtn').addEventListener('click', () => {
            isDetecting = false;
            clearInterval(detectInterval);
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('detectionStatus').textContent = '已停止';
            document.getElementById('detectionStatus').className = 'value safe';
            
            speak(messages[currentLang].stop);
            obstacles = [];
            drawDetection();
        });
        
        document.getElementById('sendBtn').addEventListener('click', () => {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (message) {
                addMessage(message, true);
                const response = handleChat(message);
                setTimeout(() => {
                    addMessage(response);
                    speak(response);
                }, 500);
                input.value = '';
            }
        });
        
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('sendBtn').click();
            }
        });
        
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                updateLang(btn.dataset.lang);
            });
        });
        
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        drawDetection();
        
        setTimeout(() => {
            addMessage(messages[currentLang].greet);
            speak(messages[currentLang].greet);
        }, 500);
        
        window.addEventListener('resize', () => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            drawDetection();
        });
    </script>
</body></html>
