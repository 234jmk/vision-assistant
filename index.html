<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>视障人群环境感知助手</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.18.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #1a1a1a;
      --accent: #f5c400;
      --accent-dark: #c49a00;
      --text: #ffffff;
      --text-dim: #cccccc;
      --danger: #ff4d4d;
      --success: #00e676;
      --info: #40c4ff;
      --border: #333333;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      gap: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    /* 标题 - 更紧凑 */
    header {
      width: 100%;
      text-align: center;
      flex-shrink: 0;
      padding: 6px 12px 4px;
    }
    header h1 {
      font-size: clamp(1rem, 3.5vw, 1.4rem);
      color: var(--accent);
      letter-spacing: 0.04em;
      line-height: 1.2;
    }
    header p {
      color: var(--text-dim);
      font-size: 0.7rem;
      margin-top: 1px;
    }

    /* 状态条 - 更紧凑 */
    #status-bar {
      width: 100%;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      flex-shrink: 0;
    }
    #status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--text-dim); flex-shrink: 0;
      transition: background 0.4s;
    }
    #status-dot.loading  { background: var(--accent); animation: pulse 1s infinite; }
    #status-dot.ready    { background: var(--success); }
    #status-dot.speaking { background: var(--info); animation: pulse 0.6s infinite; }
    #status-dot.error    { background: var(--danger); }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    /* ========== 视频容器：撑满全屏宽度，最大化高度 ========== */
    #video-container {
      position: relative;
      width: 100vw;
      flex: 1;
      min-height: 0;
      background: #000;
      overflow: hidden;
      border: none;
    }
    #webcam {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
    }
    #overlay-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #countdown-badge {
      position: absolute;
      top: 6px; right: 8px;
      background: rgba(0,0,0,0.75);
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 12px;
      border: 1px solid var(--accent);
      pointer-events: none;
    }
    #detecting-badge {
      position: absolute;
      top: 6px; left: 8px;
      background: rgba(0, 230, 118, 0.85);
      color: #000;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 12px;
      display: none;
    }

    /* ========== 底部区域：结果面板 + 按钮 ========== */
    #bottom-area {
      width: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 4px 8px 6px;
      background: var(--bg);
    }

    /* 识别结果面板 - 超紧凑 */
    #result-panel {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
      max-height: 70px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    #result-panel h2 {
      font-size: 0.75rem;
      color: var(--accent);
      margin-bottom: 3px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
    }
    #result-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #result-list li {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      padding: 2px 4px;
      border-radius: 4px;
      background: rgba(255,255,255,0.04);
    }
    .conf-bar-wrap {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .conf-bar {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--success), var(--accent));
      transition: width 0.3s;
    }
    .item-label { min-width: 40px; font-weight: 600; font-size: 0.75rem; }
    .item-dist  { min-width: 40px; color: var(--info); font-size: 0.7rem; }
    .item-conf  { min-width: 28px; color: var(--text-dim); font-size: 0.65rem; text-align: right; }

    /* ========== 语音解锁横幅 ========== */
    #voice-unlock-banner {
      display: none;
      width: 100%;
      background: #ff4d4d;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      animation: pulse 1s infinite;
      flex-shrink: 0;
    }

    /* ========== 按钮区域 ========== */
    #btn-area {
      width: 100%;
      display: flex;
      flex-direction: row;
      gap: 6px;
      flex-shrink: 0;
    }
    .big-btn {
      flex: 1;
      padding: 10px 6px;
      font-size: 0.9rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: transform 0.1s, box-shadow 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      touch-action: manipulation;
      white-space: nowrap;
    }
    .big-btn:active { transform: scale(0.97); }

    #btn-start {
      width: 100%;
      background: var(--success);
      color: #000;
      box-shadow: 0 2px 8px rgba(0,230,118,0.35);
    }

    #btn-repeat {
      background: var(--accent);
      color: #000;
      box-shadow: 0 2px 8px rgba(245,196,0,0.35);
    }
    #btn-repeat:disabled { background: #555; color: #888; box-shadow: none; cursor: not-allowed; }

    #btn-detect {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
    }
    #btn-detect:disabled { color: #555; border-color: #555; cursor: not-allowed; }

    footer {
      color: #444;
      font-size: 0.6rem;
      text-align: center;
      padding-bottom: 2px;
      flex-shrink: 0;
    }

    #sr-announce {
      position: absolute;
      left: -9999px;
      width: 1px; height: 1px;
      overflow: hidden;
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    #loading-overlay .spinner {
      width: 50px; height: 50px;
      border: 5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-overlay p { color: var(--text); font-size: 1rem; }
  </style>
</head>

<body>
  <div id="sr-announce" role="status" aria-live="assertive" aria-atomic="true"></div>

  <div id="loading-overlay" role="dialog" aria-label="模型加载中">
    <div class="spinner" aria-hidden="true"></div>
    <p id="loading-text">正在加载 AI 模型，请稍候…</p>
  </div>

  <header>
    <h1>👁️ 视障环境感知助手</h1>
    <p>TensorFlow.js COCO-SSD · 实时物体识别与语音播报</p>
  </header>

  <div id="status-bar" role="status" aria-live="polite">
    <span id="status-dot" class="loading"></span>
    <span id="status-text">正在初始化…</span>
  </div>

  <div id="video-container">
    <video id="webcam" autoplay muted playsinline aria-label="摄像头实时画面"></video>
    <canvas id="overlay-canvas" aria-hidden="true"></canvas>
    <div id="countdown-badge" aria-hidden="true">⏱ 3s</div>
    <div id="detecting-badge" aria-hidden="true">🔍 检测中…</div>
  </div>

  <div id="bottom-area">
    <div id="voice-unlock-banner" onclick="unlockVoice(this)">
      🔇 点击开启语音播报（必须开启才能听到声音）
    </div>

    <button id="btn-start" class="big-btn" style="display:none;" onclick="startApp()">
      ▶️ 点击开始检测
    </button>

    <div id="result-panel">
      <h2>📋 识别结果</h2>
      <ul id="result-list" aria-label="识别到的物体列表">
        <li style="color:#555; font-style:italic;">等待检测…</li>
      </ul>
    </div>

    <div id="btn-area">
      <button id="btn-repeat" class="big-btn" disabled aria-label="重复播报上次识别结果">
        🔊 重复播报
      </button>
      <button id="btn-detect" class="big-btn" disabled aria-label="立即进行一次物体检测">
        📷 立即检测
      </button>
    </div>
  </div>

  <footer>本工具仅供辅助参考，请注意周围环境安全</footer>

  <script>
    const LABEL_ZH = {
      person: '行人', bicycle: '自行车', car: '汽车', motorcycle: '摩托车',
      airplane: '飞机', bus: '公交车', train: '火车', truck: '卡车',
      boat: '船', 'traffic light': '交通灯', 'fire hydrant': '消防栓',
      'stop sign': '停车标志', 'parking meter': '停车计时器', bench: '长凳',
      bird: '鸟', cat: '猫', dog: '狗', horse: '马', sheep: '羊', cow: '牛',
      elephant: '大象', bear: '熊', zebra: '斑马', giraffe: '长颈鹿',
      backpack: '背包', umbrella: '雨伞', handbag: '手提包', tie: '领带',
      suitcase: '行李箱', frisbee: '飞盘', skis: '滑雪板', snowboard: '单板滑雪',
      'sports ball': '运动球', kite: '风筝', 'baseball bat': '棒球棒',
      'baseball glove': '棒球手套', skateboard: '滑板', surfboard: '冲浪板',
      'tennis racket': '网球拍', bottle: '瓶子', 'wine glass': '酒杯',
      cup: '杯子', fork: '叉子', knife: '刀', spoon: '勺子', bowl: '碗',
      banana: '香蕉', apple: '苹果', sandwich: '三明治', orange: '橙子',
      broccoli: '西兰花', carrot: '胡萝卜', 'hot dog': '热狗', pizza: '披萨',
      donut: '甜甜圈', cake: '蛋糕', chair: '椅子', couch: '沙发',
      'potted plant': '盆栽', bed: '床', 'dining table': '餐桌',
      toilet: '马桶', tv: '电视', laptop: '笔记本电脑', mouse: '鼠标',
      remote: '遥控器', keyboard: '键盘', 'cell phone': '手机',
      microwave: '微波炉', oven: '烤箱', toaster: '烤面包机',
      sink: '水槽', refrigerator: '冰箱', book: '书', clock: '时钟',
      vase: '花瓶', scissors: '剪刀', 'teddy bear': '玩具熊',
      'hair drier': '吹风机', toothbrush: '牙刷', staircase: '台阶',
      door: '门', window: '窗户', wall: '墙壁', floor: '地面',
    };

    function toZh(label) {
      return LABEL_ZH[label.toLowerCase()] || label;
    }

    function estimateDistance(bbox, videoW, videoH) {
      const [, , w, h] = bbox;
      const ratio = (w * h) / (videoW * videoH);
      if (ratio > 0.25) return '约 1 米';
      if (ratio > 0.08) return '约 2 米';
      if (ratio > 0.02) return '约 5 米';
      return '较远处';
    }

    const COLOR_MAP = [
      '#f5c400', '#00e676', '#40c4ff', '#ff6d00',
      '#ea80fc', '#ff4d4d', '#1de9b6', '#ffab40',
    ];
    function getColor(index) { return COLOR_MAP[index % COLOR_MAP.length]; }

    /* ========== 全局变量 ========== */
    let model = null;
    let lastSpeech = '';
    let countdownVal = 3;
    let countdownInt = null;
    let isDetecting = false;
    let voiceUnlocked = false;
    let appStarted = false;

    /* DOM 元素 */
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const resultList = document.getElementById('result-list');
    const btnRepeat = document.getElementById('btn-repeat');
    const btnDetect = document.getElementById('btn-detect');
    const btnStart = document.getElementById('btn-start');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');
    const countdownBadge = document.getElementById('countdown-badge');
    const detectingBadge = document.getElementById('detecting-badge');
    const unlockBanner = document.getElementById('voice-unlock-banner');
    const srAnnounce = document.getElementById('sr-announce');

    function setStatus(msg, mode = 'ready') {
      statusText.textContent = msg;
      statusDot.className = mode;
    }

    function announce(text) {
      srAnnounce.textContent = '';
      requestAnimationFrame(() => { srAnnounce.textContent = text; });
    }

    /* ========== 语音播报 ========== */
    function speak(text) {
      if (!('speechSynthesis' in window)) {
        console.warn('浏览器不支持语音');
        return;
      }
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'zh-CN';
      utt.rate = 1.0;
      utt.pitch = 1.0;
      utt.volume = 1.0;
      utt.onstart = () => { setStatus('🔊 正在播报…', 'speaking'); announce(text); };
      utt.onend = () => { setStatus('播报完成，等待下次检测…', 'ready'); };
      utt.onerror = (e) => { console.warn('TTS 出错', e); setStatus('语音播报出错', 'error'); };
      window.speechSynthesis.speak(utt);
    }

    /* ========== 解锁语音 ========== */
    window.unlockVoice = function(el) {
      const utt = new SpeechSynthesisUtterance('语音播报已开启');
      utt.lang = 'zh-CN';
      utt.volume = 1.0;
      utt.onstart = () => {
        voiceUnlocked = true;
        el.style.display = 'none';
        /* 解锁后显示开始按钮 */
        btnStart.style.display = 'flex';
        setStatus('语音已开启，请点击开始检测', 'ready');
      };
      utt.onerror = () => {
        /* 即使出错也尝试继续 */
        voiceUnlocked = true;
        el.style.display = 'none';
        btnStart.style.display = 'flex';
        setStatus('语音已开启，请点击开始检测', 'ready');
      };
      window.speechSynthesis.speak(utt);
    };

    /* ========== 物体检测 ========== */
    async function runDetection() {
      if (isDetecting || !model || video.readyState < 2) return;
      isDetecting = true;
      detectingBadge.style.display = 'block';
      setStatus('正在识别物体…', 'loading');

      let predictions = [];
      try {
        predictions = await model.detect(video);
      } catch (err) {
        console.warn('推理出错', err);
      }

      const filtered = predictions.filter(p => p.score > 0.5);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      resizeCanvas();

      filtered.forEach((pred, i) => {
        const [x, y, w, h] = pred.bbox;
        const color = getColor(i);
        const zhLabel = toZh(pred.class);
        const dist = estimateDistance(pred.bbox, canvas.width, canvas.height);
        const confPct = (pred.score * 100).toFixed(0);
        const mx = canvas.width - x - w;

        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(2, canvas.width / 200);
        ctx.strokeRect(mx, y, w, h);

        const fontSize = Math.max(14, Math.round(canvas.width / 35));
        const tagH = fontSize + 8;
        const labelText = `${zhLabel} ${dist} ${confPct}%`;
        ctx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", sans-serif`;
        const textW = ctx.measureText(labelText).width;
        const tagY = y > tagH + 4 ? y - tagH - 4 : y + h + 4;

        ctx.fillStyle = color;
        ctx.fillRect(mx, tagY, textW + 12, tagH);
        ctx.fillStyle = '#000';
        ctx.fillText(labelText, mx + 6, tagY + fontSize - 1);
      });

      /* 更新结果列表 */
      if (filtered.length === 0) {
        resultList.innerHTML = '<li style="color:#555;font-style:italic;">本次未检测到目标</li>';
      } else {
        resultList.innerHTML = filtered.map((pred, i) => {
          const color = getColor(i);
          const zhLabel = toZh(pred.class);
          const dist = estimateDistance(pred.bbox, canvas.width, canvas.height);
          const conf = (pred.score * 100).toFixed(0);
          return `<li><span class="item-label" style="color:${color}">${zhLabel}</span><div class="conf-bar-wrap"><div class="conf-bar" style="width:${conf}%"></div></div><span class="item-dist">${dist}</span><span class="item-conf">${conf}%</span></li>`;
        }).join('');
      }

      /* 语音播报 - 只要解锁了就播报 */
      if (filtered.length > 0) {
        const top3 = filtered.slice(0, 3);
        const speechParts = top3.map(pred => {
          const zhLabel = toZh(pred.class);
          const dist = estimateDistance(pred.bbox, canvas.width, canvas.height);
          return `前方${dist}有${zhLabel}`;
        });
        lastSpeech = speechParts.join('，') + '，请注意。';
        speak(lastSpeech);
      } else {
        lastSpeech = '前方暂无检测到障碍物。';
      }

      detectingBadge.style.display = 'none';
      setStatus(`上次检测：发现 ${filtered.length} 个物体`, 'ready');
      isDetecting = false;
    }

    /* ========== 自动检测 ========== */
    function startAutoDetect() {
      runDetection();
      countdownVal = 3;
      countdownBadge.textContent = `⏱ ${countdownVal}s`;
      if (countdownInt) clearInterval(countdownInt);
      countdownInt = setInterval(() => {
        countdownVal--;
        if (countdownVal <= 0) {
          countdownVal = 3;
          runDetection();
        }
        countdownBadge.textContent = `⏱ ${countdownVal}s`;
      }, 1000);
    }

    /* ========== 用户点击开始 ========== */
    window.startApp = function() {
      if (appStarted) return;
      appStarted = true;
      btnStart.style.display = 'none';
      btnRepeat.disabled = false;
      btnDetect.disabled = false;
      setStatus('正在检测中…', 'ready');
      startAutoDetect();
    };

    /* ========== Canvas 尺寸 ========== */
    function resizeCanvas() {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
    }

    /* ========== 主流程 ========== */
    (async function main() {
      setStatus('正在加载 AI 模型…', 'loading');

      /* 加载模型 */
      try {
        loadingText.textContent = '正在加载 COCO-SSD 模型（首次约需 10-30 秒）…';
        model = await cocoSsd.load({ base: 'mobilenet_v2' });
        console.log('模型加载完成');
      } catch (err) {
        console.error('模型加载失败', err);
        loadingText.textContent = '❌ 模型加载失败，请刷新重试。';
        setStatus('AI 模型加载失败', 'error');
        return;
      }

      /* 获取摄像头 */
      loadingText.textContent = '正在获取摄像头权限…';
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
        video.srcObject = stream;
        await new Promise(resolve => { video.onloadedmetadata = resolve; });
        await video.play();
        console.log('摄像头启动成功');
      } catch (err) {
        console.error('摄像头权限被拒绝', err);
        loadingText.textContent = '❌ 无法访问摄像头，请检查权限后刷新。';
        setStatus('摄像头权限被拒绝', 'error');
        return;
      }

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      /* 关闭加载遮罩 */
      loadingOverlay.style.display = 'none';
      setStatus('请先开启语音播报', 'ready');

      /* 显示语音解锁横幅 - 强制用户先点击 */
      unlockBanner.style.display = 'block';

    })();

    /* ========== 按钮事件 ========== */
    btnRepeat.addEventListener('click', () => {
      if (lastSpeech) speak(lastSpeech);
      else speak('暂无识别记录，请稍候检测。');
    });

    btnDetect.addEventListener('click', () => {
      if (countdownInt) clearInterval(countdownInt);
      countdownVal = 3;
      startAutoDetect();
    });
  </script>
</body>
</html>
