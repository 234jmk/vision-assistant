<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>视障人群环境感知助手</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.18.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #f5c400;
      --text: #ffffff;
      --text-dim: #cccccc;
      --danger: #ff4d4d;
      --success: #00e676;
      --info: #40c4ff;
      --border: #333333;
    }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      color: var(--text);
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ========== 全屏视频 ========== */
    #video-container {
      position: fixed;
      inset: 0;
      background: #000;
    }
    #webcam {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
    }
    #overlay-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* ========== 顶部状态栏 ========== */
    #status-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      padding: 8px 12px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }
    #status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--text-dim); flex-shrink: 0;
      transition: background 0.4s;
    }
    #status-dot.loading  { background: var(--accent); animation: pulse 1s infinite; }
    #status-dot.ready    { background: var(--success); }
    #status-dot.speaking { background: var(--info); animation: pulse 0.6s infinite; }
    #status-dot.error    { background: var(--danger); }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    /* 倒计时徽章 */
    #countdown-badge {
      position: fixed;
      top: 44px; right: 8px;
      background: rgba(0,0,0,0.75);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid var(--accent);
      z-index: 10;
      pointer-events: none;
    }
    #detecting-badge {
      position: fixed;
      top: 44px; left: 8px;
      background: rgba(0, 230, 118, 0.85);
      color: #000;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 12px;
      z-index: 10;
      display: none;
      pointer-events: none;
    }

    /* ========== 语音解锁大按钮（屏幕正中央） ========== */
    #voice-unlock-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    #voice-unlock-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff4d4d, #ff6b6b);
      color: #fff;
      font-size: 1.5rem;
      font-weight: 900;
      border: 5px solid #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 50px rgba(255,77,77,0.7);
      animation: pulseBig 1.5s ease-in-out infinite;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #voice-unlock-btn .icon { font-size: 3.5rem; }
    #voice-unlock-btn:active {
      transform: scale(0.93);
      background: linear-gradient(135deg, #cc3333, #ff4d4d);
    }
    @keyframes pulseBig {
      0%,100% { box-shadow: 0 0 50px rgba(255,77,77,0.7); transform: scale(1); }
      50% { box-shadow: 0 0 80px rgba(255,77,77,0.95); transform: scale(1.05); }
    }
    #voice-unlock-hint {
      color: #fff;
      font-size: 1.1rem;
      text-align: center;
      padding: 0 30px;
      opacity: 0.9;
      line-height: 1.6;
    }
    #voice-unlock-hint-small {
      color: #aaa;
      font-size: 0.85rem;
      text-align: center;
      padding: 0 30px;
    }

    /* ========== 底部浮动面板 ========== */
    #bottom-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(10, 10, 10, 0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 6px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 10;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    /* 识别结果面板 */
    #result-panel {
      width: 100%;
      background: rgba(20, 20, 20, 0.88);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
      max-height: 60px;
      overflow-y: auto;
    }
    #result-panel h2 {
      font-size: 0.75rem;
      color: var(--accent);
      margin-bottom: 2px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
    }
    #result-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #result-list li {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      padding: 2px 4px;
      border-radius: 4px;
      background: rgba(255,255,255,0.04);
    }
    .conf-bar-wrap {
      flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
    }
    .conf-bar {
      height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, var(--success), var(--accent));
      transition: width 0.3s;
    }
    .item-label { min-width: 40px; font-weight: 600; font-size: 0.75rem; }
    .item-dist  { min-width: 40px; color: var(--info); font-size: 0.7rem; }
    .item-conf  { min-width: 28px; color: var(--text-dim); font-size: 0.65rem; text-align: right; }

    /* 操作按钮行 */
    #btn-area {
      width: 100%;
      display: flex;
      flex-direction: row;
      gap: 8px;
    }
    .big-btn {
      flex: 1;
      padding: 10px 6px;
      font-size: 0.9rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      touch-action: manipulation;
      white-space: nowrap;
    }
    .big-btn:active { transform: scale(0.97); }

    #btn-repeat {
      background: var(--accent);
      color: #000;
    }
    #btn-repeat:disabled { background: #555; color: #888; cursor: not-allowed; }

    #btn-detect {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
    }
    #btn-detect:disabled { color: #555; border-color: #555; cursor: not-allowed; }

    /* 语音状态小徽章 */
    #voice-badge {
      position: fixed;
      bottom: 140px; right: 10px;
      background: rgba(0,0,0,0.7);
      color: var(--danger);
      font-size: 0.8rem;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 16px;
      border: 2px solid var(--danger);
      z-index: 11;
      display: none;
      cursor: pointer;
      touch-action: manipulation;
    }
    #voice-badge.on {
      color: var(--success);
      border-color: var(--success);
    }

    #sr-announce {
      position: absolute;
      left: -9999px;
      width: 1px; height: 1px;
      overflow: hidden;
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    #loading-overlay .spinner {
      width: 50px; height: 50px;
      border: 5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-overlay p { color: var(--text); font-size: 1rem; }
  </style>
</head>

<body>
  <div id="sr-announce" role="status" aria-live="assertive" aria-atomic="true"></div>

  <div id="loading-overlay" role="dialog" aria-label="模型加载中">
    <div class="spinner" aria-hidden="true"></div>
    <p id="loading-text">正在加载 AI 模型，请稍候…</p>
  </div>

  <!-- 语音解锁大按钮（屏幕正中央，检测已在后台运行） -->
  <div id="voice-unlock-overlay">
    <div id="voice-unlock-btn" role="button" tabindex="0" aria-label="点击开启语音播报">
      <span class="icon">🔊</span>
      <span>点击开启</span>
      <span>语音播报</span>
    </div>
    <p id="voice-unlock-hint">检测已在运行中<br>点此按钮开启语音</p>
    <p id="voice-unlock-hint-small">点击后会听到提示音，表示语音已开启</p>
  </div>

  <!-- 全屏视频 -->
  <div id="video-container">
    <video id="webcam" autoplay muted playsinline aria-label="摄像头实时画面"></video>
    <canvas id="overlay-canvas" aria-hidden="true"></canvas>
  </div>

  <!-- 顶部状态栏 -->
  <div id="status-bar" role="status" aria-live="polite">
    <span id="status-dot" class="loading"></span>
    <span id="status-text">正在初始化…</span>
  </div>

  <div id="countdown-badge" aria-hidden="true">⏱ 3s</div>
  <div id="detecting-badge" aria-hidden="true">🔍 检测中…</div>

  <!-- 右下角语音状态徽章 -->
  <div id="voice-badge" role="button" aria-label="语音状态">🔇 静音</div>

  <!-- 底部浮动面板 -->
  <div id="bottom-panel">
    <div id="result-panel">
      <h2>📋 识别结果</h2>
      <ul id="result-list" aria-label="识别到的物体列表">
        <li style="color:#555; font-style:italic;">等待检测…</li>
      </ul>
    </div>

    <div id="btn-area">
      <button id="btn-repeat" class="big-btn" disabled aria-label="重复播报">
        🔊 重复播报
      </button>
      <button id="btn-detect" class="big-btn" disabled aria-label="立即检测">
        📷 立即检测
      </button>
    </div>
  </div>

  <script>
    const LABEL_ZH = {
      person: '行人', bicycle: '自行车', car: '汽车', motorcycle: '摩托车',
      airplane: '飞机', bus: '公交车', train: '火车', truck: '卡车',
      boat: '船', 'traffic light': '交通灯', 'fire hydrant': '消防栓',
      'stop sign': '停车标志', 'parking meter': '停车计时器', bench: '长凳',
      bird: '鸟', cat: '猫', dog: '狗', horse: '马', sheep: '羊', cow: '牛',
      elephant: '大象', bear: '熊', zebra: '斑马', giraffe: '长颈鹿',
      backpack: '背包', umbrella: '雨伞', handbag: '手提包', tie: '领带',
      suitcase: '行李箱', frisbee: '飞盘', skis: '滑雪板', snowboard: '单板滑雪',
      'sports ball': '运动球', kite: '风筝', 'baseball bat': '棒球棒',
      'baseball glove': '棒球手套', skateboard: '滑板', surfboard: '冲浪板',
      'tennis racket': '网球拍', bottle: '瓶子', 'wine glass': '酒杯',
      cup: '杯子', fork: '叉子', knife: '刀', spoon: '勺子', bowl: '碗',
      banana: '香蕉', apple: '苹果', sandwich: '三明治', orange: '橙子',
      broccoli: '西兰花', carrot: '胡萝卜', 'hot dog': '热狗', pizza: '披萨',
      donut: '甜甜圈', cake: '蛋糕', chair: '椅子', couch: '沙发',
      'potted plant': '盆栽', bed: '床', 'dining table': '餐桌',
      toilet: '马桶', tv: '电视', laptop: '笔记本电脑', mouse: '鼠标',
      remote: '遥控器', keyboard: '键盘', 'cell phone': '手机',
      microwave: '微波炉', oven: '烤箱', toaster: '烤面包机',
      sink: '水槽', refrigerator: '冰箱', book: '书', clock: '时钟',
      vase: '花瓶', scissors: '剪刀', 'teddy bear': '玩具熊',
      'hair drier': '吹风机', toothbrush: '牙刷', staircase: '台阶',
      door: '门', window: '窗户', wall: '墙壁', floor: '地面',
    };

    function toZh(label) {
      return LABEL_ZH[label.toLowerCase()] || label;
    }

    function estimateDistance(bbox, videoW, videoH) {
      const [, , w, h] = bbox;
      const ratio = (w * h) / (videoW * videoH);
      if (ratio > 0.25) return '约1米';
      if (ratio > 0.08) return '约2米';
      if (ratio > 0.02) return '约5米';
      return '较远处';
    }

    const COLOR_MAP = [
      '#f5c400', '#00e676', '#40c4ff', '#ff6d00',
      '#ea80fc', '#ff4d4d', '#1de9b6', '#ffab40',
    ];
    function getColor(index) { return COLOR_MAP[index % COLOR_MAP.length]; }

    /* ========== 全局变量 ========== */
    let model = null;
    let lastSpeech = '';
    let countdownVal = 3;
    let countdownInt = null;
    let isDetecting = false;
    let voiceUnlocked = false;
    let appStarted = false;
    let audioCtx = null;  // AudioContext 用于可靠的声音反馈

    /* DOM 元素 */
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const resultList = document.getElementById('result-list');
    const btnRepeat = document.getElementById('btn-repeat');
    const btnDetect = document.getElementById('btn-detect');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');
    const countdownBadge = document.getElementById('countdown-badge');
    const detectingBadge = document.getElementById('detecting-badge');
    const srAnnounce = document.getElementById('sr-announce');
    const voiceUnlockOverlay = document.getElementById('voice-unlock-overlay');
    const voiceUnlockBtn = document.getElementById('voice-unlock-btn');
    const voiceBadge = document.getElementById('voice-badge');

    function setStatus(msg, mode = 'ready') {
      statusText.textContent = msg;
      statusDot.className = mode;
    }

    function announce(text) {
      srAnnounce.textContent = '';
      requestAnimationFrame(() => { srAnnounce.textContent = text; });
    }

    /* ========== AudioContext 声音引擎（手机上比 SpeechSynthesis 可靠） ========== */
    function initAudioCtx() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          audioCtx = new AC();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    /* 用 AudioContext 播放一个短促的提示音 */
    function playBeep(freq, duration, vol) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq || 880;
        gain.gain.value = vol || 0.5;
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (duration || 0.15));
        osc.stop(audioCtx.currentTime + (duration || 0.15) + 0.01);
      } catch(e) {
        console.warn('playBeep error', e);
      }
    }

    /* 播放"开启成功"的旋律（两声短音） */
    function playUnlockMelody() {
      playBeep(660, 0.12, 0.6);
      setTimeout(() => playBeep(880, 0.15, 0.6), 150);
    }

    /* 播放"检测到物体"的提示音（一声升调） */
    function playDetectSound() {
      playBeep(520, 0.08, 0.4);
      setTimeout(() => playBeep(780, 0.1, 0.4), 100);
    }

    /* ========== 语音播报（双引擎：SpeechSynthesis + AudioContext 备用） ========== */
    let speechSynthWorks = false;  // 标记 SpeechSynthesis 是否真正可用

    function speak(text) {
      announce(text);

      /* 引擎1: 尝试 SpeechSynthesis（能播报中文语音） */
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utt = new SpeechSynthesisUtterance(text);
          utt.lang = 'zh-CN';
          utt.rate = 1.0;
          utt.pitch = 1.0;
          utt.volume = 1.0;

          let resolved = false;
          utt.onstart = () => {
            resolved = true;
            speechSynthWorks = true;
            setStatus('🔊 正在播报…', 'speaking');
          };
          utt.onend = () => {
            setStatus('播报完成', 'ready');
          };
          utt.onerror = (e) => {
            console.warn('TTS error', e);
            /* SpeechSynthesis 失败，用 AudioContext 提示音代替 */
            if (!resolved) {
              speechSynthWorks = false;
              playDetectSound();
            }
          };

          window.speechSynthesis.speak(utt);

          /* 1.5秒后如果还没触发 onstart，说明 SpeechSynthesis 不工作，降级到提示音 */
          setTimeout(() => {
            if (!resolved && !speechSynthWorks) {
              speechSynthWorks = false;
              playDetectSound();
            }
          }, 1500);

          return;
        } catch(e) {
          console.warn('SpeechSynthesis exception', e);
        }
      }

      /* 引擎2: SpeechSynthesis 不可用，用 AudioContext 提示音 */
      playDetectSound();
    }

    /* ========== 解锁语音（大按钮） ========== */
    function doUnlockVoice() {
      if (voiceUnlocked) return;

      /* ★ 关键改动：立即标记解锁 + 立即关闭遮罩，不依赖 SpeechSynthesis 的回调 */
      voiceUnlocked = true;
      voiceUnlockOverlay.style.display = 'none';
      voiceBadge.textContent = '🔊 语音已开';
      voiceBadge.classList.add('on');
      setStatus('语音已开启，正在检测中', 'ready');

      /* 初始化 AudioContext（必须在用户手势中调用） */
      initAudioCtx();

      /* 播放解锁提示音（AudioContext 比 SpeechSynthesis 可靠） */
      playUnlockMelody();

      /* 同时尝试 SpeechSynthesis 说一句话（如果能用就用） */
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utt = new SpeechSynthesisUtterance('语音已开启');
          utt.lang = 'zh-CN';
          utt.volume = 1.0;
          utt.onstart = () => { speechSynthWorks = true; };
          utt.onerror = () => { speechSynthWorks = false; };
          window.speechSynthesis.speak(utt);
        } catch(e) {
          speechSynthWorks = false;
        }
      }
    }

    /* ★ 三种事件全部绑定：touchstart / touchend / click，确保手机一定触发 */
    let unlockTriggered = false;

    function handleUnlock(e) {
      if (unlockTriggered) return;
      unlockTriggered = true;
      if (e) e.preventDefault();
      doUnlockVoice();
    }

    voiceUnlockBtn.addEventListener('touchstart', handleUnlock, { passive: false });
    voiceUnlockBtn.addEventListener('touchend', handleUnlock, { passive: false });
    voiceUnlockBtn.addEventListener('click', handleUnlock);

    /* 右下角语音徽章点击也能重新开启 */
    voiceBadge.addEventListener('touchstart', function(e) {
      e.preventDefault();
      initAudioCtx();
      if (!voiceUnlocked) doUnlockVoice();
    }, { passive: false });
    voiceBadge.addEventListener('click', function() {
      initAudioCtx();
      if (!voiceUnlocked) doUnlockVoice();
    });

    /* ========== 物体检测 ========== */
    async function runDetection() {
      if (isDetecting || !model || video.readyState < 2) return;
      isDetecting = true;
      detectingBadge.style.display = 'block';
      setStatus('正在识别物体…', 'loading');

      let predictions = [];
      try {
        predictions = await model.detect(video);
      } catch (err) {
        console.warn('推理出错', err);
      }

      const filtered = predictions.filter(p => p.score > 0.5);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      resizeCanvas();

      filtered.forEach((pred, i) => {
        const [x, y, w, h] = pred.bbox;
        const color = getColor(i);
        const zhLabel = toZh(pred.class);
        const dist = estimateDistance(pred.bbox, canvas.width, canvas.height);
        const confPct = (pred.score * 100).toFixed(0);
        const mx = canvas.width - x - w;

        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(2, canvas.width / 200);
        ctx.strokeRect(mx, y, w, h);

        const fontSize = Math.max(14, Math.round(canvas.width / 35));
        const tagH = fontSize + 8;
        const labelText = `${zhLabel} ${dist} ${confPct}%`;
        ctx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", sans-serif`;
        const textW = ctx.measureText(labelText).width;
        const tagY = y > tagH + 4 ? y - tagH - 4 : y + h + 4;

        ctx.fillStyle = color;
        ctx.fillRect(mx, tagY, textW + 12, tagH);
        ctx.fillStyle = '#000';
        ctx.fillText(labelText, mx + 6, tagY + fontSize - 1);
      });

      /* 更新结果列表 */
      if (filtered.length === 0) {
        resultList.innerHTML = '<li style="color:#555;font-style:italic;">本次未检测到目标</li>';
      } else {
        resultList.innerHTML = filtered.map((pred, i) => {
          const color = getColor(i);
          const zhLabel = toZh(pred.class);
          const dist = estimateDistance(pred.bbox, canvas.width, canvas.height);
          const conf = (pred.score * 100).toFixed(0);
          return `<li><span class="item-label" style="color:${color}">${zhLabel}</span><div class="conf-bar-wrap"><div class="conf-bar" style="width:${conf}%"></div></div><span class="item-dist">${dist}</span><span class="item-conf">${conf}%</span></li>`;
        }).join('');
      }

      /* 语音播报 + 提示音（只有开启语音后才播报） */
      if (filtered.length > 0) {
        const top3 = filtered.slice(0, 3);
        const speechParts = top3.map(pred => {
          const zhLabel = toZh(pred.class);
          const dist = estimateDistance(pred.bbox, canvas.width, canvas.height);
          return `前方${dist}有${zhLabel}`;
        });
        lastSpeech = speechParts.join('，') + '，请注意。';
        if (voiceUnlocked) speak(lastSpeech);
      } else {
        lastSpeech = '前方暂无检测到障碍物。';
      }

      detectingBadge.style.display = 'none';
      setStatus(`上次检测：发现 ${filtered.length} 个物体`, 'ready');
      isDetecting = false;
    }

    /* ========== 自动检测 ========== */
    function startAutoDetect() {
      runDetection();
      countdownVal = 3;
      countdownBadge.textContent = `⏱ ${countdownVal}s`;
      if (countdownInt) clearInterval(countdownInt);
      countdownInt = setInterval(() => {
        countdownVal--;
        if (countdownVal <= 0) {
          countdownVal = 3;
          runDetection();
        }
        countdownBadge.textContent = `⏱ ${countdownVal}s`;
      }, 1000);
    }

    /* ========== Canvas 尺寸 ========== */
    function resizeCanvas() {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
    }

    /* ========== 主流程 ========== */
    (async function main() {
      setStatus('正在加载 AI 模型…', 'loading');

      try {
        loadingText.textContent = '正在加载 COCO-SSD 模型（首次约需 10-30 秒）…';
        model = await cocoSsd.load({ base: 'mobilenet_v2' });
        console.log('模型加载完成');
      } catch (err) {
        console.error('模型加载失败', err);
        loadingText.textContent = '❌ 模型加载失败，请刷新重试。';
        setStatus('AI 模型加载失败', 'error');
        return;
      }

      loadingText.textContent = '正在获取摄像头权限…';
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
        video.srcObject = stream;
        await new Promise(resolve => { video.onloadedmetadata = resolve; });
        await video.play();
        console.log('摄像头启动成功');
      } catch (err) {
        console.error('摄像头权限被拒绝', err);
        loadingText.textContent = '❌ 无法访问摄像头，请检查权限后刷新。';
        setStatus('摄像头权限被拒绝', 'error');
        return;
      }

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      /* 关闭加载遮罩 */
      loadingOverlay.style.display = 'none';

      /* 自动开始检测 */
      appStarted = true;
      btnRepeat.disabled = false;
      btnDetect.disabled = false;
      setStatus('正在检测中…', 'ready');
      startAutoDetect();

      /* 弹出语音解锁大按钮 */
      voiceUnlockOverlay.style.display = 'flex';
      voiceBadge.style.display = 'block';

    })();

    /* ========== 按钮事件 ========== */
    btnRepeat.addEventListener('click', () => {
      initAudioCtx();
      if (lastSpeech) speak(lastSpeech);
      else speak('暂无识别记录，请稍候检测。');
    });

    btnDetect.addEventListener('click', () => {
      initAudioCtx();
      if (countdownInt) clearInterval(countdownInt);
      countdownVal = 3;
      startAutoDetect();
    });
  </script>
</body>
</html>
