<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>视障人群环境感知助手</title>

  <!-- 引入 TensorFlow.js 核心库 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.18.0/dist/tf.min.js"></script>
  <!-- 引入 COCO-SSD 预训练物体检测模型（可识别 90 种常见物体） -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

  <style>
    /* =====================================================
       全局样式：高对比度，适合视障用户
       ===================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0a;          /* 深黑底色 */
      --surface: #1a1a1a;     /* 卡片背景 */
      --accent: #f5c400;      /* 高对比黄色强调色 */
      --accent-dark: #c49a00;
      --text: #ffffff;
      --text-dim: #cccccc;
      --danger: #ff4d4d;
      --success: #00e676;
      --info: #40c4ff;
      --border: #333333;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      gap: 16px;
      user-select: none;
    }

    /* =====================================================
       顶部标题区
       ===================================================== */
    header {
      width: 100%;
      max-width: 800px;
      text-align: center;
    }

    header h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: var(--accent);
      letter-spacing: 0.04em;
      line-height: 1.3;
    }

    header p {
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* =====================================================
       状态指示条
       ===================================================== */
    #status-bar {
      width: 100%;
      max-width: 800px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 46px;
    }

    #status-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
      transition: background 0.4s;
    }

    #status-dot.loading  { background: var(--accent); animation: pulse 1s infinite; }
    #status-dot.ready    { background: var(--success); }
    #status-dot.speaking { background: var(--info); animation: pulse 0.6s infinite; }
    #status-dot.error    { background: var(--danger); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    #status-text {
      font-size: 1rem;
      color: var(--text);
    }

    /* =====================================================
       视频 + Canvas 叠加容器
       ===================================================== */
    #video-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--border);
      /* 保持 4:3 宽高比 */
      aspect-ratio: 4 / 3;
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1); /* 镜像翻转，符合用户直觉 */
    }

    /* Canvas 叠加在视频上方，用于绘制边界框 */
    /* 注意：不通过 CSS 镜像 Canvas，而是在 JS 中手动翻转坐标，
       这样视频呈现镜像效果（符合自拍直觉），但文字保持正向可读 */
    #overlay-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* 右上角计时徽章：显示下次识别倒计时 */
    #countdown-badge {
      position: absolute;
      top: 10px; right: 12px;
      background: rgba(0,0,0,0.7);
      color: var(--accent);
      font-size: 1.1rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--accent);
      pointer-events: none;
      letter-spacing: 0.05em;
    }

    /* 左上角：正在检测动态提示 */
    #detecting-badge {
      position: absolute;
      top: 10px; left: 12px;
      background: rgba(0, 230, 118, 0.85);
      color: #000;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      display: none;
    }


    /* =====================================================
       底部按钮区
       ===================================================== */
    #btn-area {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 通用大按钮样式 */
    .big-btn {
      width: 100%;
      padding: 18px 10px;
      font-size: 1.3rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: transform 0.1s, box-shadow 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .big-btn:active {
      transform: scale(0.97);
    }

    /* 主按钮：重复播报 */
    #btn-repeat {
      background: var(--accent);
      color: #000;
      box-shadow: 0 4px 20px rgba(245,196,0,0.35);
    }

    #btn-repeat:hover { background: #ffd600; box-shadow: 0 6px 24px rgba(245,196,0,0.5); }
    #btn-repeat:disabled { background: #555; color: #888; box-shadow: none; cursor: not-allowed; }

    /* 次按钮：手动立即检测 */
    #btn-detect {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
      box-shadow: none;
    }

    #btn-detect:hover { background: rgba(245,196,0,0.1); }
    #btn-detect:disabled { color: #555; border-color: #555; cursor: not-allowed; }

    /* =====================================================
       无障碍：高对比度文字公告区（屏幕阅读器可读）
       ===================================================== */
    #sr-announce {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    /* =====================================================
       加载模型遮罩
       ===================================================== */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    #loading-overlay .spinner {
      width: 60px; height: 60px;
      border: 6px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-overlay p {
      color: var(--text);
      font-size: 1.1rem;
    }

    /* =====================================================
       页脚小字
       ===================================================== */
    footer {
      color: #444;
      font-size: 0.75rem;
      text-align: center;
      padding-bottom: 8px;
    }
  </style>
</head>

<body>
  <!-- ===== 无障碍公告区（屏幕阅读器专用） ===== -->
  <div id="sr-announce" role="status" aria-live="assertive" aria-atomic="true"></div>

  <!-- ===== 加载遮罩 ===== -->
  <div id="loading-overlay" role="dialog" aria-label="模型加载中">
    <div class="spinner" aria-hidden="true"></div>
    <p id="loading-text">正在加载 AI 模型，请稍候…</p>
  </div>

  <!-- ===== 页面标题 ===== -->
  <header>
    <h1>👁️ 视障环境感知助手</h1>
    <p>基于 TensorFlow.js COCO-SSD · 实时物体识别与语音播报</p>
  </header>

  <!-- ===== 状态指示条 ===== -->
  <div id="status-bar" role="status" aria-live="polite">
    <span id="status-dot" class="loading"></span>
    <span id="status-text">正在初始化…</span>
  </div>

  <!-- ===== 摄像头视频区 ===== -->
  <div id="video-container">
    <!-- 摄像头原始视频流 -->
    <video id="webcam" autoplay muted playsinline aria-label="摄像头实时画面"></video>
    <!-- 叠加 Canvas：绘制检测框 -->
    <canvas id="overlay-canvas" aria-hidden="true"></canvas>
    <!-- 倒计时徽章 -->
    <div id="countdown-badge" aria-hidden="true">⏱ 3s</div>
    <!-- 正在检测提示 -->
    <div id="detecting-badge" aria-hidden="true">🔍 检测中…</div>
  </div>

<!-- ===== 语音解锁提示（移动端首次需要用户交互才能播放声音） ===== -->
  <div id="voice-unlock-banner" style="display:none;width:100%;max-width:800px;background:#ff4d4d;color:#fff;
    font-size:1.1rem;font-weight:700;text-align:center;padding:14px;border-radius:12px;cursor:pointer;
    animation:pulse 1s infinite;" onclick="unlockVoice(this)">
    🔇 点击此处开启语音播报
  </div>

  <!-- ===== 底部按钮区 ===== -->
  <div id="btn-area">
    <!-- 重复上次播报按钮（主功能键） -->
    <button id="btn-repeat" class="big-btn" disabled aria-label="重复播报上次识别结果">
      🔊 重复上次播报
    </button>
    <!-- 手动立即检测按钮 -->
    <button id="btn-detect" class="big-btn" disabled aria-label="立即进行一次物体检测">
      📷 立即检测
    </button>
  </div>

  <footer>本工具仅供辅助参考，请注意周围环境安全</footer>

  <script>
    /* =====================================================
       COCO-SSD 中文物体名称映射表（90 种常见物体）
       ===================================================== */
    const LABEL_ZH = {
      person: '行人', bicycle: '自行车', car: '汽车', motorcycle: '摩托车',
      airplane: '飞机', bus: '公交车', train: '火车', truck: '卡车',
      boat: '船', 'traffic light': '交通灯', 'fire hydrant': '消防栓',
      'stop sign': '停车标志', 'parking meter': '停车计时器', bench: '长凳',
      bird: '鸟', cat: '猫', dog: '狗', horse: '马', sheep: '羊', cow: '牛',
      elephant: '大象', bear: '熊', zebra: '斑马', giraffe: '长颈鹿',
      backpack: '背包', umbrella: '雨伞', handbag: '手提包', tie: '领带',
      suitcase: '行李箱', frisbee: '飞盘', skis: '滑雪板', snowboard: '单板滑雪',
      'sports ball': '运动球', kite: '风筝', 'baseball bat': '棒球棒',
      'baseball glove': '棒球手套', skateboard: '滑板', surfboard: '冲浪板',
      'tennis racket': '网球拍', bottle: '瓶子', 'wine glass': '酒杯',
      cup: '杯子', fork: '叉子', knife: '刀', spoon: '勺子', bowl: '碗',
      banana: '香蕉', apple: '苹果', sandwich: '三明治', orange: '橙子',
      broccoli: '西兰花', carrot: '胡萝卜', 'hot dog': '热狗', pizza: '披萨',
      donut: '甜甜圈', cake: '蛋糕', chair: '椅子', couch: '沙发',
      'potted plant': '盆栽', bed: '床', 'dining table': '餐桌',
      toilet: '马桶', tv: '电视', laptop: '笔记本电脑', mouse: '鼠标',
      remote: '遥控器', keyboard: '键盘', 'cell phone': '手机',
      microwave: '微波炉', oven: '烤箱', toaster: '烤面包机',
      sink: '水槽', refrigerator: '冰箱', book: '书', clock: '时钟',
      vase: '花瓶', scissors: '剪刀', 'teddy bear': '玩具熊',
      'hair drier': '吹风机', toothbrush: '牙刷', staircase: '台阶',
      door: '门', window: '窗户', wall: '墙壁', floor: '地面',
    };

    /* 将英文标签转中文，未收录的保留英文 */
    function toZh(label) {
      return LABEL_ZH[label.toLowerCase()] || label;
    }

    /* =====================================================
       距离估算：根据边界框面积占画面比例推断距离
       面积占比越大 → 物体越近
       ===================================================== */
    function estimateDistance(bbox, videoW, videoH) {
      const [, , w, h] = bbox;
      const ratio = (w * h) / (videoW * videoH);
      if (ratio > 0.25) return '约 1 米';
      if (ratio > 0.08) return '约 2 米';
      if (ratio > 0.02) return '约 5 米';
      return '较远处';
    }

    /* =====================================================
       颜色映射：不同物体类型使用不同边框颜色
       ===================================================== */
    const COLOR_MAP = [
      '#f5c400', '#00e676', '#40c4ff', '#ff6d00',
      '#ea80fc', '#ff4d4d', '#1de9b6', '#ffab40',
    ];
    function getColor(index) { return COLOR_MAP[index % COLOR_MAP.length]; }

    /* =====================================================
       主程序入口
       ===================================================== */
    (async function main() {
      /* 获取 DOM 元素 */
      const video        = document.getElementById('webcam');
      const canvas       = document.getElementById('overlay-canvas');
      const ctx          = canvas.getContext('2d');
      const statusDot    = document.getElementById('status-dot');
      const statusText   = document.getElementById('status-text');
      const srAnnounce   = document.getElementById('sr-announce');
      const btnRepeat    = document.getElementById('btn-repeat');
      const btnDetect    = document.getElementById('btn-detect');
      const loadingOverlay = document.getElementById('loading-overlay');
      const loadingText  = document.getElementById('loading-text');
      const countdownBadge = document.getElementById('countdown-badge');
      const detectingBadge = document.getElementById('detecting-badge');

      /* 全局状态变量 */
      let model         = null;   // COCO-SSD 模型实例
      let lastSpeech    = '';     // 上次播报文本，供"重复播报"使用
      let detectTimer   = null;   // 自动检测定时器
      let countdownVal  = 3;      // 倒计时秒数
      let countdownInt  = null;   // 倒计时 setInterval
      let isDetecting   = false;  // 防止并发检测

      /* -------------------------
         工具：更新状态栏
         ------------------------- */
      function setStatus(msg, mode = 'ready') {
        statusText.textContent = msg;
        statusDot.className = mode;
      }

      /* -------------------------
         工具：屏幕阅读器公告
         ------------------------- */
      function announce(text) {
        srAnnounce.textContent = '';
        requestAnimationFrame(() => { srAnnounce.textContent = text; });
      }

      /* =====================================================
         Step 1：加载 COCO-SSD 模型
         ===================================================== */
      setStatus('正在加载 AI 模型…', 'loading');
      try {
        loadingText.textContent = '正在加载 COCO-SSD 模型（首次加载约需 10-30 秒）…';
        model = await cocoSsd.load({ base: 'mobilenet_v2' });
        console.log('[视障助手] COCO-SSD 模型加载完成');
      } catch (err) {
        console.error('[视障助手] 模型加载失败', err);
        loadingText.textContent = '❌ 模型加载失败，请刷新页面重试。';
        setStatus('AI 模型加载失败，请刷新页面', 'error');
        return;
      }

      /* =====================================================
         Step 2：请求摄像头权限并启动视频流
         ===================================================== */
      loadingText.textContent = '正在获取摄像头权限…';
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
        video.srcObject = stream;
        await new Promise(resolve => { video.onloadedmetadata = resolve; });
        await video.play();
        console.log('[视障助手] 摄像头启动成功');
      } catch (err) {
        console.error('[视障助手] 摄像头权限被拒绝', err);
        loadingText.textContent = '❌ 无法访问摄像头，请检查浏览器权限设置后刷新。';
        setStatus('摄像头权限被拒绝', 'error');
        return;
      }

      /* 调整 Canvas 分辨率与视频一致 */
      function resizeCanvas() {
        canvas.width  = video.videoWidth  || 640;
        canvas.height = video.videoHeight || 480;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      /* =====================================================
         Step 3：关闭加载遮罩，激活按钮
         ===================================================== */
      loadingOverlay.style.display = 'none';
      btnRepeat.disabled = false;
      btnDetect.disabled = false;
      setStatus('模型就绪，即将开始检测…', 'ready');
      announce('视障环境感知助手已就绪，即将开始自动检测');

      /* 移动端语音解锁：检测是否需要用户交互才能播放语音 */
      let voiceUnlocked = false;
      const unlockBanner = document.getElementById('voice-unlock-banner');

      /* 尝试用一个无声 utterance 探测语音是否可用 */
      function tryUnlockVoice() {
        if (voiceUnlocked) return;
        const probe = new SpeechSynthesisUtterance(' ');
        probe.volume = 0;
        probe.onstart = () => { voiceUnlocked = true; unlockBanner.style.display = 'none'; };
        probe.onerror = () => { unlockBanner.style.display = 'block'; };
        window.speechSynthesis.speak(probe);
        /* 500ms 后若还未触发 onstart，说明被浏览器拦截了 */
        setTimeout(() => { if (!voiceUnlocked) unlockBanner.style.display = 'block'; }, 500);
      }

      /* 全局函数：用户点击横幅后解锁语音 */
      window.unlockVoice = function(el) {
        const utt = new SpeechSynthesisUtterance('语音播报已开启');
        utt.lang = 'zh-CN';
        utt.volume = 1.0;
        utt.onstart = () => { voiceUnlocked = true; el.style.display = 'none'; };
        window.speechSynthesis.speak(utt);
      };

      /* =====================================================
         Step 4：物体检测核心函数
         ===================================================== */
      async function runDetection() {
        if (isDetecting || !model || video.readyState < 2) return;
        isDetecting = true;

        /* 显示"检测中"提示 */
        detectingBadge.style.display = 'block';
        setStatus('正在识别物体…', 'loading');

        let predictions = [];
        try {
          /* 执行 COCO-SSD 推理 */
          predictions = await model.detect(video);
        } catch (err) {
          console.warn('[视障助手] 推理出错', err);
        }

        /* 只保留置信度 > 0.5 的检测结果 */
        const filtered = predictions.filter(p => p.score > 0.5);

        /* 清空 Canvas，准备绘制新的边界框 */
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        resizeCanvas();

        /* 渲染边界框与标签 */
        /* 视频通过 CSS scaleX(-1) 做了镜像，Canvas 未做 CSS 镜像；
           因此在 JS 中手动翻转 x 坐标，使检测框与视频画面对齐，
           同时文字保持正向（不受 CSS 镜像影响） */
        filtered.forEach((pred, i) => {
          const [x, y, w, h] = pred.bbox;
          const color    = getColor(i);
          const zhLabel  = toZh(pred.class);
          const dist     = estimateDistance(pred.bbox, canvas.width, canvas.height);
          const confPct  = (pred.score * 100).toFixed(0);

          /* 将原始坐标沿画布中线做水平镜像，与 CSS 翻转后的视频对齐 */
          const mx = canvas.width - x - w;

          /* 绘制边界框（线条加粗，手机上更清晰） */
          ctx.strokeStyle = color;
          ctx.lineWidth   = Math.max(3, canvas.width / 160);
          ctx.strokeRect(mx, y, w, h);

          /* 字体大小自适应画布尺寸，手机上更大更清晰 */
          const fontSize  = Math.max(18, Math.round(canvas.width / 28));
          const tagH      = fontSize + 10;
          const labelText = `${zhLabel} ${dist} ${confPct}%`;
          ctx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", sans-serif`;
          const textW = ctx.measureText(labelText).width;
          const tagY  = y > tagH + 4 ? y - tagH - 4 : y + h + 4;

          /* 标签背景加黑色描边，提升任何背景下的可读性 */
          ctx.fillStyle = color;
          ctx.fillRect(mx, tagY, textW + 16, tagH);

          /* 绘制标签文字（正向，清晰可读） */
          ctx.fillStyle = '#000';
          ctx.fillText(labelText, mx + 8, tagY + fontSize);
        });

        /* 构建语音播报文本 */
        if (filtered.length > 0) {
          /* 每次最多播报前 3 个，避免信息过载 */
          const top3 = filtered.slice(0, 3);
          const speechParts = top3.map(pred => {
            const zhLabel = toZh(pred.class);
            const dist    = estimateDistance(pred.bbox, canvas.width, canvas.height);
            return `前方${dist}有${zhLabel}`;
          });
          lastSpeech = speechParts.join('，') + '，请注意。';
          speak(lastSpeech);
        } else {
          lastSpeech = '前方暂无检测到障碍物。';
          /* 空结果不主动播报，避免频繁干扰 */
        }

        /* 恢复状态 */
        detectingBadge.style.display = 'none';
        setStatus(`上次检测：发现 ${filtered.length} 个物体`, 'ready');
        isDetecting = false;
      }

      /* =====================================================
         Step 5：Web Speech API 语音播报
         ===================================================== */
      function speak(text) {
        if (!('speechSynthesis' in window)) {
          console.warn('[视障助手] 浏览器不支持 Web Speech API');
          return;
        }
        /* 取消正在播报的内容，立即播报最新结果 */
        window.speechSynthesis.cancel();

        const utt = new SpeechSynthesisUtterance(text);
        utt.lang  = 'zh-CN';
        utt.rate  = 1.0;   /* 语速：1.0 正常，可调高至 1.3 提升信息密度 */
        utt.pitch = 1.0;   /* 音调 */
        utt.volume = 1.0;  /* 音量最大 */

        /* 播报开始/结束时更新状态 */
        utt.onstart = () => {
          setStatus('🔊 正在播报…', 'speaking');
          announce(text); /* 同步更新屏幕阅读器 */
        };
        utt.onend = () => {
          setStatus('播报完成，等待下次检测…', 'ready');
        };
        utt.onerror = (e) => {
          console.warn('[视障助手] TTS 出错', e);
          setStatus('语音播报出错', 'error');
        };

        window.speechSynthesis.speak(utt);
      }

      /* =====================================================
         Step 6：自动周期检测（每 3 秒一次）+ 倒计时徽章
         ===================================================== */
      function startAutoDetect() {
        /* 立即执行一次 */
        runDetection();

        /* 启动倒计时显示 */
        countdownVal = 3;
        countdownBadge.textContent = `⏱ ${countdownVal}s`;

        if (countdownInt) clearInterval(countdownInt);
        countdownInt = setInterval(() => {
          countdownVal--;
          if (countdownVal <= 0) {
            countdownVal = 3;
            runDetection();
          }
          countdownBadge.textContent = `⏱ ${countdownVal}s`;
        }, 1000);
      }

      /* 启动自动检测 */
      tryUnlockVoice();
      startAutoDetect();

      /* =====================================================
         Step 7：按钮事件绑定
         ===================================================== */

      /* "重复上次播报"按钮 */
      btnRepeat.addEventListener('click', () => {
        if (lastSpeech) {
          speak(lastSpeech);
        } else {
          speak('暂无识别记录，请稍候自动检测。');
        }
      });

      /* "立即检测"按钮：重置倒计时并立即执行 */
      btnDetect.addEventListener('click', () => {
        /* 重置倒计时 */
        if (countdownInt) clearInterval(countdownInt);
        countdownVal = 3;
        startAutoDetect();
      });

    })(); /* main 立即执行函数结束 */
  </script>
</body>
</html>
