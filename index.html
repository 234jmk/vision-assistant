<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>视障助手 - 智能环境感知</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- PWA 配置 -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.18.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #f5c400;
      --green: #00e676;
      --blue: #40c4ff;
      --red: #ff4d4d;
      --orange: #ff9900;
      --border: #333;
      --text: #fff;
      --dim: #aaa;
    }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      color: var(--text);
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== 全屏视频 ===== */
    #video-container {
      position: fixed; inset: 0; background: #000;
    }
    #webcam {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    #overlay-canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* ===== 顶部状态栏 ===== */
    #status-bar {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      padding: 8px 12px;
      font-size: 0.85rem;
      display: flex; align-items: center; gap: 8px;
      z-index: 10;
    }
    #status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--dim); flex-shrink: 0;
      transition: background 0.4s;
    }
    #status-dot.loading  { background: var(--accent); animation: pulse 1s infinite; }
    #status-dot.ready    { background: var(--green); }
    #status-dot.listening { background: var(--blue); animation: pulse 0.6s infinite; }
    #status-dot.speaking { background: var(--green); animation: pulse 0.6s infinite; }
    #status-dot.error    { background: var(--red); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ===== 倒计时 + 语言徽章 ===== */
    #countdown-badge {
      position: fixed; top: 44px; right: 8px;
      background: rgba(0,0,0,0.75);
      color: var(--accent); font-size: 0.85rem; font-weight: bold;
      padding: 3px 8px; border-radius: 12px;
      border: 1px solid var(--accent); z-index: 10;
      pointer-events: none;
    }
    #detecting-badge {
      position: fixed; top: 44px; left: 8px;
      background: rgba(0,230,118,0.85); color: #000;
      font-size: 0.75rem; font-weight: bold;
      padding: 3px 8px; border-radius: 12px;
      z-index: 10; display: none; pointer-events: none;
    }
    #cur-lang-badge {
      position: fixed; top: 44px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: var(--blue);
      font-size: 0.75rem; padding: 2px 10px;
      border-radius: 10px; border: 1px solid var(--blue);
      z-index: 10; pointer-events: none; display: none;
    }

    /* ===== 语音指令徽章 ===== */
    #voice-command-badge {
      position: fixed; bottom: 180px; left: 50%; transform: translateX(-50%);
      background: rgba(255,102,0,0.9); color: #fff;
      font-size: 0.85rem; font-weight: bold;
      padding: 8px 20px; border-radius: 20px;
      z-index: 10; display: none; pointer-events: none;
      box-shadow: 0 4px 15px rgba(255,102,0,0.5);
    }
    #voice-command-badge.listening {
      display: block;
      animation: pulseBig 1s ease-in-out infinite;
    }
    @keyframes pulseBig {
      0%,100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.05); }
    }

    /* ===== 底部面板 ===== */
    #bottom-panel {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(10,10,10,0.88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 6px 10px 12px;
      display: flex; flex-direction: column; gap: 6px;
      z-index: 10;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    #result-panel {
      width: 100%;
      background: rgba(20,20,20,0.88);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
      max-height: 64px; overflow-y: auto;
    }
    #result-panel h2 {
      font-size: 0.75rem; color: var(--accent);
      margin-bottom: 2px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
    }
    #result-list {
      list-style: none;
      display: flex; flex-direction: column; gap: 2px;
    }
    #result-list li {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.75rem; padding: 2px 4px;
      border-radius: 4px;
      background: rgba(255,255,255,0.04);
    }
    .conf-bar-wrap { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .conf-bar { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--green), var(--accent)); transition: width 0.3s; }
    .item-label { min-width: 44px; font-weight: 600; font-size: 0.75rem; }
    .item-dist  { min-width: 44px; color: var(--blue); font-size: 0.7rem; }
    .item-conf  { min-width: 28px; color: var(--dim); font-size: 0.65rem; text-align: right; }

    /* 操作按钮行 */
    #btn-area {
      width: 100%; display: flex; gap: 8px;
    }
    .big-btn {
      flex: 1; padding: 10px 6px;
      font-size: 0.9rem; font-weight: 700;
      border: none; border-radius: 8px;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      gap: 4px; touch-action: manipulation;
      white-space: nowrap;
    }
    .big-btn:active { transform: scale(0.97); }
    #btn-repeat { background: var(--accent); color: #000; }
    #btn-repeat:disabled { background: #555; color: #888; cursor: not-allowed; }
    #btn-detect { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
    #btn-detect:disabled { color: #555; border-color: #555; cursor: not-allowed; }
    #btn-listen { background: var(--blue); color: #000; }
    #btn-listen.active { background: var(--orange); color: #fff; }

    /* ===== 加载覆盖层 ===== */
    #loading-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
    }

    /* ===== 点击开始覆盖层（解决移动端音频权限） ===== */
    #start-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 1001;
      display: none; /* 默认隐藏，等加载完成后显示 */
      flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
      padding: 40px;
    }
    #start-overlay.visible {
      display: flex;
    }
    #start-btn {
      padding: 20px 48px;
      font-size: 1.4rem;
      font-weight: 700;
      color: #000;
      background: var(--accent);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 8px 30px rgba(245,196,0,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #start-btn:active {
      transform: scale(0.96);
      box-shadow: 0 4px 15px rgba(245,196,0,0.3);
    }
    #start-hint {
      color: var(--dim);
      font-size: 0.85rem;
      text-align: center;
      line-height: 1.6;
    }
    .spinner {
      width: 50px; height: 50px;
      border: 5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-overlay p {
      color: var(--text); font-size: 1rem;
      text-align: center; padding: 0 20px;
    }

    #sr-announce {
      position: absolute; left: -9999px;
      width: 1px; height: 1px; overflow: hidden;
    }

    /* 语言切换按钮 */
    #lang-row {
      position: fixed; top: 80px; right: 8px;
      display: flex; flex-direction: column; gap: 6px;
      z-index: 10;
    }
    .lang-btn {
      padding: 6px 12px; border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.4);
      background: rgba(0,0,0,0.7);
      color: #fff; font-size: 0.8rem; cursor: pointer;
      touch-action: manipulation; transition: all 0.2s;
    }
    .lang-btn.active {
      background: var(--accent); color: #000;
      border-color: var(--accent); font-weight: 700;
    }
  </style>
</head>

<body>
  <div id="sr-announce" role="status" aria-live="assertive" aria-atomic="true"></div>

  <!-- 加载界面 -->
  <div id="loading-overlay" role="dialog" aria-label="模型加载中">
    <div class="spinner" aria-hidden="true"></div>
    <p id="loading-text">正在加载 AI 模型，请稍候…</p>
  </div>

  <!-- 点击开始界面（解决移动端语音权限问题） -->
  <div id="start-overlay" role="dialog" aria-label="启动确认">
    <div style="width:80px;height:80px;border:6px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;"></div>
    <p style="color:var(--accent);font-size:1.1rem;font-weight:bold;">模型与摄像头已就绪</p>
    <button id="start-btn">👆 点击开始使用</button>
    <p id="start-hint">首次使用请点击上方按钮激活语音播报<br>部分浏览器需要用户手势才能播放声音</p>
  </div>

  <!-- 全屏视频 -->
  <div id="video-container">
    <video id="webcam" autoplay muted playsinline aria-label="摄像头实时画面"></video>
    <canvas id="overlay-canvas" aria-hidden="true"></canvas>
  </div>

  <!-- 语言切换 -->
  <div id="lang-row">
    <button class="lang-btn active" data-lang="zh">中文</button>
    <button class="lang-btn" data-lang="en">English</button>
    <button class="lang-btn" data-lang="ja">日本語</button>
    <button class="lang-btn" data-lang="ko">한국어</button>
  </div>

  <!-- 顶部状态栏 -->
  <div id="status-bar" role="status" aria-live="polite">
    <span id="status-dot" class="loading"></span>
    <span id="status-text">正在初始化…</span>
  </div>

  <div id="countdown-badge">⏱ 3s</div>
  <div id="detecting-badge">🔍 检测中…</div>
  <div id="cur-lang-badge">CN 中文播报</div>
  <div id="voice-command-badge">🎤 在听你说…</div>

  <!-- 底部面板 -->
  <div id="bottom-panel">
    <div id="result-panel">
      <h2>📋 识别结果</h2>
      <ul id="result-list" aria-label="识别到的物体列表">
        <li style="color:#555; font-style:italic;">等待检测…</li>
      </ul>
    </div>
    <div id="btn-area">
      <button id="btn-repeat" class="big-btn" disabled>🔊 重复播报</button>
      <button id="btn-detect" class="big-btn" disabled>📷 立即检测</button>
      <button id="btn-listen" class="big-btn">🎤 开始对话</button>
    </div>
  </div>

        chat_unknown:'죄송합니다, 이해하지 못했습니다. 도로 상황에 대해 물어보거나 채팅할 수 있어요!',
        greeting:'안녕하세요! 채팅하게 되어 기쁩니다!',
        goodbye:'안녕히 가세요! 안전한 여행 되세요!',
        thanks:'천만에요! 언제든 도와드릴게요!',
        joke:'장애물이 왜 저를 무서워할까요? 제가 미리 알려주니까요！ 하하하！',
        song:'모든 길에서 안전이 첫 번째～',
        weather:'오늘 날씨가 좋네요!',
        food:'어떤 음식을 좋아하세요?',
        travel:'여행은 시야를 넓혀줘요! 어디로 여행가고 싶어요?',
        name:'스마트 도로 비서입니다!',
        hobby:'도로 상황 검출하고 당신의 안전을 지키는 게 좋아요!',
        age:'막 태어난 AI 비서라서 아직 0살이에요!',
        help:'도로 상황 검출, 장애물 통보, 채팅이 가능합니다！편하게 말씀하세요！',
      },
    };

    let currentLang = 'zh';

    function L(key) {
      return (LABELS[currentLang] && LABELS[currentLang][key]) || (LABELS['zh'][key]) || key;
    }
    function toLabel(cls) {
      const key = cls.toLowerCase();
      return (LABELS[currentLang] && LABELS[currentLang][key]) || (LABELS['zh'][key]) || cls;
    }
    function estimateDistance(bbox, vw, vh) {
      const [, , w, h] = bbox;
      const ratio = (w * h) / (vw * vh);
      if (ratio > 0.25) return L('dist_1m');
      if (ratio > 0.08) return L('dist_2m');
      if (ratio > 0.02) return L('dist_5m');
      return L('dist_far');
    }

    const COLOR_MAP = ['#f5c400','#00e676','#40c4ff','#ff6d00','#ea80fc','#ff4d4d','#1de9b6','#ffab40'];
    function getColor(i) { return COLOR_MAP[i % COLOR_MAP.length]; }

    /* ========== 全局状态 ========== */
    let model = null;
    let lastSpeech = '';
    let countdownVal = 3;
    let countdownInt = null;
    let isDetecting = false;
    let ttsVoice = null;
    let isListening = false;
    let isSpeaking = false;
    let recognition = null;

    /* DOM */
    const video         = document.getElementById('webcam');
    const canvas        = document.getElementById('overlay-canvas');
    const ctx           = canvas.getContext('2d');
    const statusDot     = document.getElementById('status-dot');
    const statusText    = document.getElementById('status-text');
    const resultList    = document.getElementById('result-list');
    const btnRepeat     = document.getElementById('btn-repeat');
    const btnDetect     = document.getElementById('btn-detect');
    const btnListen     = document.getElementById('btn-listen');
    const loadingOverlay= document.getElementById('loading-overlay');
    const loadingText   = document.getElementById('loading-text');
    const countdownBadge= document.getElementById('countdown-badge');
    const detectingBadge= document.getElementById('detecting-badge');
    const srAnnounce    = document.getElementById('sr-announce');
    const curLangBadge       = document.getElementById('cur-lang-badge');
    const voiceCommandBadge  = document.getElementById('voice-command-badge');
    const startOverlay       = document.getElementById('start-overlay');
    const startBtn           = document.getElementById('start-btn');

    function setStatus(msg, mode) {
      statusText.textContent = msg;
      statusDot.className = mode || 'ready';
    }
    function announce(text) {
      srAnnounce.textContent = '';
      requestAnimationFrame(() => { srAnnounce.textContent = text; });
    }

    /* ========== 语言切换 ========== */
    const LANG_NAMES = { zh:'CN 中文', en:'GB English', ja:'JP 日本語', ko:'KR 한국어' };

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentLang = this.dataset.lang;
        curLangBadge.textContent = LANG_NAMES[currentLang];
        curLangBadge.style.display = 'block';
        pickVoice();
      });
    });

    /* ========== 豆包AI配置（保留供将来使用） ========== */
    const DOUBAO_CONFIG = {
      apiKey: 'ark-2049d098-5a37-4ec0-8229-2cc47c793acd-b829d',
      apiUrl: 'https://ark.cn-beijing.volces.com/api/v3/chat/completions'
    };

    /* ========== 处理语音输入（本地关键词匹配） ========== */
    function handleUserVoiceInput(text) {
      const t = text.toLowerCase();

      /* 停止聆听 - 优先处理 */
      if (/停止|stop|止め|멈춰/.test(t)) {
        stopListening();
        speak(L('listen_stop'));
        return;
      }
      /* 重复播报路况 */
      if (/路况|traffic|交通|前方|障碍/.test(t)) {
        speak(lastSpeech || L('no_obj'));
        return;
      }
      /* 你好 */
      if (/你好|hello|hi|こんにちは|안녕/.test(t)) {
        speak(L('greeting'));
      }
      /* 再见 */
      else if (/再见|bye|goodbye|さようなら|안녕히/.test(t)) {
        speak(L('goodbye'));
      }
      /* 谢谢 */
      else if (/谢谢|谢|thanks|ありがとう|감사/.test(t)) {
        speak(L('thanks'));
      }
      /* 笑话 */
      else if (/笑话|笑一个|joke|冗談|농담/.test(t)) {
        speak(L('joke'));
      }
      /* 唱歌 */
      else if (/唱歌|唱|sing|歌|노래/.test(t)) {
        speak(L('song'));
      }
      /* 天气 */
      else if (/天气|weather|天気|날씨/.test(t)) {
        speak(L('weather'));
      }
      /* 美食/吃 */
      else if (/吃|食物|美食|food|料理|음식|饿/.test(t)) {
        speak(L('food'));
      }
      /* 旅行 */
      else if (/旅行|旅游|travel|여행/.test(t)) {
        speak(L('travel'));
      }
      /* 名字 */
      else if (/名字|你叫|你是谁|name|名前|이름/.test(t)) {
        speak(L('name'));
      }
      /* 爱好 */
      else if (/爱好|喜欢什么|hobby|趣味|취미/.test(t)) {
        speak(L('hobby'));
      }
      /* 年龄 */
      else if (/年龄|几岁|多大|age|年|나이/.test(t)) {
        speak(L('age'));
      }
      /* 帮助 */
      else if (/帮助|能做什么|怎么用|help|何ができる|도움/.test(t)) {
        speak(L('help'));
      }
      /* 默认回复 */
      else {
        speak(L('chat_unknown'));
      }
    }

    /* ========== 语音引擎 ========== */
    function pickVoice() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return;
      const langCode = L('voice_lang');
      const langBase = langCode.split('-')[0];
      let v = voices.find(v => v.lang === langCode && v.localService);
      if (!v) v = voices.find(v => v.lang.startsWith(langBase) && v.localService);
      if (!v) v = voices.find(v => v.lang === langCode);
      if (!v) v = voices.find(v => v.lang.startsWith(langBase));
      ttsVoice = v || null;
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = pickVoice;
      pickVoice();
    }

    /* ========== 语音播报 ========== */
    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      announce(text);

      /* 先停止识别，避免把自己的声音识别成输入 */
      if (recognition) {
        try { recognition.abort(); } catch(e) {}
      }

      window.speechSynthesis.cancel();
      isSpeaking = true;

      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = L('voice_lang');
      utt.rate = 1.0;
      utt.pitch = 1.0;
      utt.volume = 1.0;
      if (ttsVoice) utt.voice = ttsVoice;

      utt.onstart = () => setStatus('正在播报…', 'speaking');
      utt.onend = () => {
        isSpeaking = false;
        setStatus('播报完成', 'ready');
        /* 播报结束后，等一小会儿再重启识别，避免尾音被识别 */
        if (isListening) {
          setTimeout(() => {
            if (isListening && !isSpeaking) {
              recognition = initSpeechRecognition();
              try { recognition.start(); } catch(e) {}
            }
          }, 600);
        }
      };
      utt.onerror = () => {
        isSpeaking = false;
        setStatus('播报完成', 'ready');
        if (isListening) {
          setTimeout(() => {
            if (isListening && !isSpeaking) {
              recognition = initSpeechRecognition();
              try { recognition.start(); } catch(e) {}
            }
          }, 600);
        }
      };
      window.speechSynthesis.speak(utt);
    }

    /* ========== 语音识别 ========== */
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        console.warn('当前浏览器不支持语音识别');
        return null;
      }

      const rec = new SpeechRecognition();
      rec.continuous = false;      /* 每次识别一句话，识别完自动停止 */
      rec.interimResults = false;
      rec.maxAlternatives = 1;

      /* 设置语言 */
      const langMap = { zh: 'zh-CN', en: 'en-US', ja: 'ja-JP', ko: 'ko-KR' };
      rec.lang = langMap[currentLang] || 'zh-CN';

      rec.onstart = () => {
        setStatus('👂 正在聆听，请说话…', 'listening');
        voiceCommandBadge.textContent = '🎤 我在听…';
        voiceCommandBadge.classList.add('listening');
      };

      rec.onend = () => {
        voiceCommandBadge.classList.remove('listening');
        /* 如果还在聆听模式且当前没在播报，则重新启动识别 */
        if (isListening && !isSpeaking) {
          setTimeout(() => {
            if (isListening && !isSpeaking) {
              recognition = initSpeechRecognition();
              try { recognition.start(); } catch(e) {}
            }
          }, 400);
        }
      };

      rec.onerror = (event) => {
        console.warn('语音识别错误:', event.error);
        voiceCommandBadge.classList.remove('listening');

        if (event.error === 'not-allowed') {
          setStatus('麦克风权限被拒绝，请在浏览器设置中允许', 'error');
          isListening = false;
          btnListen.classList.remove('active');
          btnListen.textContent = '🎤 开始对话';
          return;
        }

        /* no-speech / aborted / audio-capture 等，继续重试 */
        if (isListening && !isSpeaking) {
          setTimeout(() => {
            if (isListening && !isSpeaking) {
              recognition = initSpeechRecognition();
              try { recognition.start(); } catch(e) {}
            }
          }, 400);
        }
      };

      rec.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim();
        console.log('识别到:', transcript);
        voiceCommandBadge.textContent = `💬 "${transcript}"`;
        if (transcript) {
          handleUserVoiceInput(transcript);
        }
      };

      return rec;
    }

    /* ========== 聆听控制 ========== */
    function startListening() {
      isListening = true;
      btnListen.classList.add('active');
      btnListen.textContent = '🎤 停止对话';

      /* 每次开始都重新创建识别器（避免复用状态残留） */
      recognition = initSpeechRecognition();
      if (!recognition) {
        speak('抱歉，您的浏览器不支持语音识别功能');
        isListening = false;
        btnListen.classList.remove('active');
        btnListen.textContent = '🎤 开始对话';
        return;
      }

      try {
        recognition.start();
      } catch(e) {
        console.warn('语音识别启动失败:', e);
      }

      speak(L('listen_start'));
    }

    function stopListening() {
      isListening = false;
      btnListen.classList.remove('active');
      btnListen.textContent = '🎤 开始对话';

      voiceCommandBadge.classList.remove('listening');

      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
    }

    function toggleListening() {
      if (isListening) {
        stopListening();
        speak(L('listen_stop'));
      } else {
        startListening();
      }
    }

    /* ========== 物体检测 ========== */
    async function runDetection() {
      if (isDetecting || !model || video.readyState < 2) return;
      isDetecting = true;
      detectingBadge.style.display = 'block';
      setStatus('正在识别物体…', 'loading');

      let predictions = [];
      try {
        predictions = await model.detect(video);
      } catch (err) {
        console.warn('推理出错', err);
      }

      const filtered = predictions.filter(p => p.score > 0.4);
      resizeCanvas();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      filtered.forEach((pred, i) => {
        const [x, y, w, h] = pred.bbox;
        const color = getColor(i);
        const label = toLabel(pred.class);
        const dist  = estimateDistance(pred.bbox, canvas.width, canvas.height);
        const conf  = (pred.score * 100).toFixed(0);

        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(2, canvas.width / 200);
        ctx.strokeRect(x, y, w, h);

        const fontSize = Math.max(14, Math.round(canvas.width / 35));
        const tagH = fontSize + 8;
        const labelText = `${label} ${dist} ${conf}%`;
        ctx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", sans-serif`;
        const textW = ctx.measureText(labelText).width;
        const tagY = y > tagH + 4 ? y - tagH - 4 : y + h + 4;
        ctx.fillStyle = color;
        ctx.fillRect(x, tagY, textW + 12, tagH);
        ctx.fillStyle = '#000';
        ctx.fillText(labelText, x + 6, tagY + fontSize - 1);
      });

      /* 结果列表 */
      if (filtered.length === 0) {
        resultList.innerHTML = '<li style="color:#555;font-style:italic;">本次未检测到目标</li>';
      } else {
        resultList.innerHTML = filtered.map((pred, i) => {
          const color = getColor(i);
          const label = toLabel(pred.class);
          const dist  = estimateDistance(pred.bbox, canvas.width, canvas.height);
          const conf  = (pred.score * 100).toFixed(0);
          return `<li>
            <span class="item-label" style="color:${color}">${label}</span>
            <div class="conf-bar-wrap"><div class="conf-bar" style="width:${conf}%"></div></div>
            <span class="item-dist">${dist}</span>
            <span class="item-conf">${conf}%</span>
          </li>`;
        }).join('');
      }

      /* 语音播报 */
      if (filtered.length > 0) {
        const top3 = filtered.slice(0, 3);
        let parts;
        if (currentLang === 'zh') {
          parts = top3.map(p => `前方${estimateDistance(p.bbox, canvas.width, canvas.height)}有${toLabel(p.class)}`);
          lastSpeech = parts.join('，') + '，请注意。';
        } else if (currentLang === 'en') {
          parts = top3.map(p => `${toLabel(p.class)} at ${estimateDistance(p.bbox, canvas.width, canvas.height)} ahead`);
          lastSpeech = parts.join(', ') + '. Please be careful.';
        } else if (currentLang === 'ja') {
          parts = top3.map(p => `前方${estimateDistance(p.bbox, canvas.width, canvas.height)}に${toLabel(p.class)}`);
          lastSpeech = parts.join('、') + '。注意してください。';
        } else if (currentLang === 'ko') {
          parts = top3.map(p => `전방 ${estimateDistance(p.bbox, canvas.width, canvas.height)}에 ${toLabel(p.class)}`);
          lastSpeech = parts.join(', ') + '. 주의하세요.';
        }
        speak(lastSpeech);
      } else {
        lastSpeech = L('no_obj');
      }

      detectingBadge.style.display = 'none';
      setStatus(`上次检测：发现 ${filtered.length} 个物体`, 'ready');
      isDetecting = false;
    }

    /* ========== 自动检测 ========== */
    function startAutoDetect() {
      runDetection();
      countdownVal = 3;
      countdownBadge.textContent = `⏱ ${countdownVal}s`;
      if (countdownInt) clearInterval(countdownInt);
      countdownInt = setInterval(() => {
        countdownVal--;
        if (countdownVal <= 0) { countdownVal = 3; runDetection(); }
        countdownBadge.textContent = `⏱ ${countdownVal}s`;
      }, 1000);
    }

    function resizeCanvas() {
      canvas.width  = video.videoWidth  || 640;
      canvas.height = video.videoHeight || 480;
    }

    /* ========== 事件绑定 ========== */
    btnRepeat.addEventListener('click', () => {
      if (lastSpeech) speak(lastSpeech);
      else speak(L('no_obj'));
    });

    btnDetect.addEventListener('click', () => {
      if (countdownInt) clearInterval(countdownInt);
      countdownVal = 3;
      startAutoDetect();
    });

    btnListen.addEventListener('click', toggleListening);

    /* ========== 音频解锁（必须通过用户手势调用） ========== */
    function unlockAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        const actx = new AC();
        if (actx.state === 'suspended') actx.resume();
        const buf = actx.createBuffer(1, 1, 22050);
        const src = actx.createBufferSource();
        src.buffer = buf;
        src.connect(actx.destination);
        src.start(0);
      }
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
        const utt = new SpeechSynthesisUtterance(' ');
        utt.volume = 0;
        window.speechSynthesis.speak(utt);
      }
    }

    /* ========== 点击开始 ========== */
    function onUserStart() {
      console.log('[PWA] 用户点击开始，解锁音频');
      unlockAudio();
      startOverlay.classList.remove('visible');

      btnRepeat.disabled = false;
      btnDetect.disabled = false;
      setStatus('正在检测中…', 'ready');
      startAutoDetect();

      /* 初始化语音识别 */
      recognition = initSpeechRecognition();

      /* 显示语言选择提示 */
      curLangBadge.textContent = LANG_NAMES[currentLang];
      curLangBadge.style.display = 'block';

      /* 语音打招呼 */
      setTimeout(() => {
        speak(L('opening'));
      }, 300);
    }

    /* ========== 主流程 ========== */
    (async function main() {
      setStatus('正在加载 AI 模型…', 'loading');

      try {
        loadingText.textContent = '正在加载 COCO-SSD 模型（首次约需 10-30 秒）…';
        model = await cocoSsd.load({ base: 'mobilenet_v2' });
      } catch (err) {
        loadingText.textContent = '模型加载失败，请刷新重试。';
        setStatus('AI 模型加载失败', 'error');
        return;
      }

      loadingText.textContent = '正在获取摄像头权限…';
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
        video.srcObject = stream;
        await new Promise(resolve => { video.onloadedmetadata = resolve; });
        await video.play();
      } catch (err) {
        loadingText.textContent = '无法访问摄像头，请检查权限后刷新。';
        setStatus('摄像头权限被拒绝', 'error');
        return;
      }

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      loadingOverlay.style.display = 'none';

      /* 显示点击开始界面 */
      startOverlay.classList.add('visible');
      startBtn.addEventListener('click', onUserStart, { once: true });
    })();
  </script>
